              --hash=sha256:188306098d013b691fcadc011abd66727d3c414c571bb01b1a174ba8c983cf90
          typing-extensions==4.16.0 \
              --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
          urllib3==2.8.0 \
              --hash=sha256:0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
          REQUIREMENTS
          "$venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement "$requirements"
          reported="$("$venv/bin/pip-audit" --version)"
          if [ "$reported" != "pip-audit ${PIP_AUDIT_VERSION}" ]; then
            echo "::error::Expected pip-audit ${PIP_AUDIT_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Audit requirements-machinery.lock (pip-audit)
        run: |
          set -euo pipefail
          lock="$PWD/requirements-machinery.lock"
          if [ ! -f "$lock" ]; then
            echo "::error::requirements-machinery.lock is missing; nothing would be audited"
            exit 1
          fi
          pins="$(grep -cE '^[A-Za-z0-9][A-Za-z0-9._-]*==' "$lock" || true)"
          echo "pip-audit checks ${pins} pinned package(s) in requirements-machinery.lock."
          if [ "$pins" -eq 0 ]; then
            echo "::error::requirements-machinery.lock pins no package"
            exit 1
          fi
          work="$RUNNER_TEMP/pip-audit"
          rm -rf "$work"
          mkdir -p "$work/home"
          report="$work/report.json"
          # Any known vulnerability, unknown package or tool error fails the job.
          status=0
          env -i PATH=/usr/bin:/bin HOME="$work/home" \
            "$RUNNER_TEMP/pip-audit-venv/bin/pip-audit" --strict --disable-pip --require-hashes \
            --progress-spinner=off --format json --output "$report" --requirement "$lock" || status=$?
          if [ ! -s "$report" ]; then
            echo "::error::pip-audit exited ${status} without a report"
            exit 1
          fi
          jq -r '.dependencies[] | .name as $name | .version as $version | .vulns[]
            | "::error::\($name) \($version): \(.id) (fixed in: \(.fix_versions | join(", ")))"' "$report"
          audited="$(jq '[.dependencies[] | select(has("skip_reason") | not)] | length' "$report")"
          vulns="$(jq '[.dependencies[].vulns[]] | length' "$report")"
          echo "pip-audit audited ${audited} of ${pins} pinned package(s); ${vulns} known vulnerabilities."
          if [ "$audited" -ne "$pins" ]; then
            echo "::error::pip-audit audited ${audited} package(s) but the lock pins ${pins}; a skipped or marker-excluded pin is not audited"
            exit 1
          fi
          if [ "$status" -ne 0 ] || [ "$vulns" -ne 0 ]; then
            echo "::error::pip-audit failed (exit ${status}, ${vulns} known vulnerabilities)"
            exit 1
          fi

      - name: Audit package-lock.json (npm audit)
        run: |
          set -euo pipefail
          for file in package.json package-lock.json; do
            if [ ! -f "$file" ]; then
              echo "::error::${file} is missing; nothing would be audited"
              exit 1
            fi
          done
          packages="$(jq '[.packages // {} | to_entries[] | select(.key != "")] | length' package-lock.json)"
          echo "npm audit checks ${packages} locked package(s) in package-lock.json."
          if [ "$packages" -eq 0 ]; then
            echo "::error::package-lock.json locks no package"
            exit 1
          fi
          npm_bin="$(command -v npm)"
          node_dir="$(dirname "$(command -v node)")"
          echo "$("$npm_bin" --version) (npm), $(node --version) (node)"
          work="$RUNNER_TEMP/npm-audit"
          rm -rf "$work"
          mkdir -p "$work/home"
          # A high or critical advisory, or any audit error, fails the job.
          env -i PATH="$node_dir:/usr/bin:/bin" HOME="$work/home" \
            "$npm_bin" audit --package-lock-only --audit-level=high

      - name: Remove tools
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/pip-audit" "$RUNNER_TEMP/npm-audit"
          "$RUNNER_TEMP/pip-audit-venv" "$RUNNER_TEMP/pip-audit-requirements.txt"

  # The release path of docs/release.md on a hosted runner: build sdist and
  # wheel from the tracked tree with pinned tools, fill a temporary wheelhouse
  # with the wheel and every locked dependency, install offline with hashes
  # required, then import every module from the installed wheel only.
  installed-wheel:
    name: Installed wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Build sdist and wheel with pinned tools
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          rm -rf "$work"
          mkdir -p "$work/src" "$work/dist"
          # Only tracked files, as in a release build.
          git archive --format=tar HEAD | tar -x -C "$work/src"
          cd "$work"
          python -I -m venv build-venv
          cat > build-requirements.txt <<'REQUIREMENTS'
          build==1.6.1 \
              --hash=sha256:ecd351a4be9d35a9eaaba244a7687143c9c7d4aea6ac964e7e7ddab20cbcf4e7
          packaging==26.3 \
              --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pyproject-hooks==1.2.0 \
              --hash=sha256:9e5c6bfa8dcc30091c74b0cf803c81fdd29d94f01992a7707bc97babb1141913
          setuptools==84.1.0 \
              --hash=sha256:5231689c6ac8156cd155cfb98c3fd6fb252c3e7e9bd3d78b64d3c55f132624c9
          REQUIREMENTS
          build-venv/bin/python -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement build-requirements.txt
          build-venv/bin/python -I -m build --sdist --wheel --no-isolation --outdir dist src
          ls -l dist
          wheels="$(find dist -maxdepth 1 -name 'lu_machinery-*-py3-none-any.whl' | wc -l)"
          sdists="$(find dist -maxdepth 1 -name 'lu_machinery-*.tar.gz' | wc -l)"
          if [ "$wheels" -ne 1 ] || [ "$sdists" -ne 1 ]; then
            echo "::error::Expected one wheel and one sdist, got ${wheels} and ${sdists}"
            exit 1
          fi

      - name: Install offline from a hash-locked wheelhouse
        run: |
          set -euo pipefail
          lock="$PWD/requirements-machinery.lock"
          work="$RUNNER_TEMP/installed-wheel"
          cd "$work"
          wheel="$(find dist -maxdepth 1 -name 'lu_machinery-*-py3-none-any.whl')"
          version="$(python -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' src/pyproject.toml)"
          mkdir wheelhouse
          python -I -m pip download --no-cache-dir --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: --no-deps --dest wheelhouse --requirement "$lock"
          cp "$wheel" wheelhouse/
          # The consumer lock: the release line, then the dependency lock.
          digest="$(sha256sum "$wheel" | cut -d' ' -f1)"
          { printf 'lu-machinery==%s \\\n    --hash=sha256:%s\n' "$version" "$digest"; cat "$lock"; } > consumer.lock
          echo "lu-machinery ${version} sha256:${digest}; wheelhouse holds $(find wheelhouse -name '*.whl' | wc -l) wheel(s)"
          python -I -m venv consumer
          consumer/bin/python -I -m pip install --no-cache-dir --disable-pip-version-check --no-input \
            --no-index --find-links wheelhouse --require-hashes --requirement consumer.lock
          consumer/bin/python -I -m pip check --disable-pip-version-check

      - name: Import every module from the installed wheel
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          mkdir -p "$work/scratch/home"
          cat > "$work/import_all.py" <<'PY'
          import importlib
          import importlib.metadata
          import sys
          from pathlib import Path

          import lu_machinery

          # Modules that need an optional extra of pyproject.toml, which the
          # lock does not install: each may fail only with ModuleNotFoundError
          # for that extra's package.
          OPTIONAL = {"lu_machinery.debug.debug_pymorphy": "pymorphy2"}

          site = Path(sys.argv[1]).resolve()
          origin = Path(lu_machinery.__file__).resolve()
          print(f"lu-machinery {importlib.metadata.version('lu-machinery')} from {origin}")
          if site not in origin.parents:
              sys.exit(f"::error::lu_machinery was imported from {origin}, not the consumer venv")
          # The distribution's file manifest (RECORD) lists every shipped
          # module, including namespace subtrees that pkgutil discovery skips.
          names = set()
          for file in importlib.metadata.distribution("lu-machinery").files or []:
              parts = file.parts
              if parts[0] != "lu_machinery" or file.suffix != ".py":
                  continue
              parts = parts[:-1] if parts[-1] == "__init__.py" else (*parts[:-1], file.stem)
              if not all(part.isidentifier() for part in parts):
                  sys.exit(f"::error::{file} is shipped but cannot be imported by name")
              names.add(".".join(parts))
          failed = {}
          optional = 0
          for name in sorted(names):
              try:
                  module = importlib.import_module(name)
              except ModuleNotFoundError as exc:
                  if name in OPTIONAL and exc.name == OPTIONAL[name]:
                      print(f"{name}: skipped, needs the optional {exc.name}")
                      optional += 1
                  else:
                      failed[name] = f"ModuleNotFoundError: {exc}"
                  continue
              except BaseException as exc:  # a module that exits on import fails too
                  failed[name] = f"{type(exc).__name__}: {exc}"
                  continue
              # Namespace packages have no __file__, only __path__ entries.
              origins = [module.__file__] if module.__file__ else list(module.__path__)
              stray = [path for path in origins if site not in Path(path).resolve().parents]
              if not origins or stray:
                  failed[name] = f"imported from {origins}"
          for name, reason in sorted(failed.items()):
              print(f"::error::{name}: {reason}")
          print(f"Imported {len(names) - len(failed) - optional} of {len(names)} module(s); {optional} need an optional extra.")
          if not names or failed:
              sys.exit(1)
          PY
          cd "$work/scratch"
          # No checkout, PYTHONPATH or runner variable reaches the imports.
          env -i PATH=/usr/bin:/bin HOME="$work/scratch/home" TMPDIR="$work/scratch" \
            LEARN_UKRAINIAN_PYTHON="$work/consumer/bin/python" \
            "$work/consumer/bin/python" -I -B "$work/import_all.py" "$work/consumer"

      - name: Remove build files
        if: always()
        run: rm -rf "$RUNNER_TEMP/installed-wheel"

  # Full six-shard suite. Skipped on pull_request; CI Gate then requires that
  # skip, and requires pr-affected instead. A skip on merge_group fails the gate.
  pytest:
    name: pytest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.

  # Changed tests, importers, text readers, guards and repo_wide invariants.
  # The workflow run shows this job's time. merge_group does not run it.
  pr-affected:
    name: PR changed tests and guards
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.

  ci-gate:
    name: CI Gate
    # always(): a job skipped because a dependency failed would otherwise count
    # as a passing required check.
    if: always()
    needs: [ruff, compileall, mypy, actionlint, zizmor, secret-scan, sast, dependency-audit, installed-wheel, pytest, pr-affected]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Keep the two lists together equal to `needs` above. On merge_group,
          # push and workflow_dispatch, pytest is tests.yml's full six-shard
          # suite and must succeed; pr-affected must be skipped. On pull_request
          # the reverse holds. Failed, cancelled, skipped and missing required
          # results all fail this gate.
          common=(actionlint compileall dependency-audit installed-wheel mypy ruff sast secret-scan zizmor)
          case "$EVENT_NAME" in
            pull_request)
              must_succeed=(pr-affected "${common[@]}")
              must_skip=(pytest)
              ;;
            merge_group|push|workflow_dispatch)
              must_succeed=(pytest "${common[@]}")
              must_skip=(pr-affected)
              ;;
            *)
              echo "::error::Unsupported event ${EVENT_NAME}"
              exit 1
              ;;
          esac
          if ! actual="$(jq -r 'if type == "object" then keys[] else error("not an object") end' \
                <<< "$NEEDS_JSON" 2> /dev/null)"; then
            echo "::error::Job results are not a JSON object; failing closed"
            exit 1
          fi
          failed=0
          for job in "${must_succeed[@]}"; do
            result="$(jq -r --arg job "$job" \
              '.[$job].result // "missing" | if type == "string" then . else "invalid" end' \
              <<< "$NEEDS_JSON")"
            echo "${job}: ${result} (required success)"
            if [ "$result" != "success" ]; then
              echo "::error::Required job ${job} finished with result ${result}"
              failed=1
            fi
          done
          for job in "${must_skip[@]}"; do
            result="$(jq -r --arg job "$job" \
              '.[$job].result // "missing" | if type == "string" then . else "invalid" end' \
              <<< "$NEEDS_JSON")"
            echo "${job}: ${result} (required skipped)"
            if [ "$result" != "skipped" ]; then
              echo "::error::Job ${job} finished with result ${result}; this event must not run it"
              failed=1
            fi
          done
          expected=("${must_succeed[@]}" "${must_skip[@]}")
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            if ! printf '%s\n' "${expected[@]}" | grep -qxF -- "$job"; then
              echo "::error::Unexpected job ${job} in the gate's dependencies"
              failed=1
            fi
          done <<< "$actual"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "CI Gate green: ${#must_succeed[@]} required job(s) succeeded on ${EVENT_NAME}."
