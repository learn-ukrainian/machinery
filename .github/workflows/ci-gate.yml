# DRAFT for the public learn-ukrainian/machinery repository (machinery move
# plan v1, section 4 steps 4 and 7). Install it there as
# .github/workflows/ci-gate.yml before final history clearance. It is not a
# check in this source repository.
#
# Bootstrap CI for the first push. Branch protection requires one check named
# "CI Gate", and the merge queue ruleset waits for that check on merge groups.
# Main pushes also run it to seed shared, verified tool archives. Pins and their
# upstream evidence are recorded in pins.txt beside this file; bump them
# together there.
#
# - Jobs: Ruff over lu_machinery/ with the source repository's Ruff version and
#   lint settings (the extracted tree has no Ruff configuration yet); compileall
#   of lu_machinery on Python 3.12; the mypy ratchet (lu_machinery.lint.mypy_ratchet:
#   new errors fail, the baseline only shrinks); actionlint (with a pinned ShellCheck) and zizmor (offline) over
#   .github/workflows/; the TruffleHog secret scan and the Semgrep SAST scan;
#   dependency-audit (pip-audit of requirements-machinery.lock, npm audit of
#   package-lock.json). The secret-scan and sast jobs below are the only
#   definition of each scan for the machinery repository; CodeQL code scanning
#   is codeql.yml beside this file, outside the gate. installed-wheel builds the release wheel
#   from the tracked tree, installs it offline with requirements-machinery.lock
#   (pip --require-hashes) into a clean venv and imports every lu_machinery
#   module from it. pytest calls tests.yml for the full six-shard suite on
#   merge_group, push and workflow_dispatch. pull_request calls that workflow
#   as pr-affected and does not run the full suite.
# - The mypy job imports lu_machinery from the checkout: it runs the ratchet
#   module. installed-wheel imports only the installed wheel.
# - Every job counts its targets first and fails on zero, because the tools
#   exit 0 on an empty or missing target. Each job prints what it inspected.
# - CI Gate needs every other job, runs even when one of them fails, and passes
#   only when each job reports the result its event requires. On pull_request,
#   pr-affected must succeed and pytest must be skipped. On merge_group, push
#   and workflow_dispatch, pytest (the full suite) must succeed and pr-affected
#   must be skipped. A failed, cancelled, skipped or missing required job fails
#   the gate, because GitHub counts a skipped required check as passing. Each check name is the job
#   name. The called tests.yml reports its shards as "pytest / pytest (N)"
#   and their always() aggregate as "pytest / pytest shards"; `pytest` here
#   succeeds only if all of them do. On pull_request that job is skipped and
#   `pr-affected` is required instead. A failed, cancelled, skipped or missing
#   required job fails the gate on every event. A new job must be added to both
#   `needs` and the gate's expected list; nothing else catches a job left out of both.
# - Hosted runners only (ubuntu-24.04). Every tool is downloaded at a pinned
#   version and checked against a pinned SHA-256 before it runs: release
#   tarballs for actionlint and ShellCheck, hash-pinned PyPI wheels
#   (pip --require-hashes --only-binary=:all:) for Ruff, mypy, zizmor, Semgrep
#   and pip-audit; npm audit uses the hosted runner's npm.
#   Install steps run from the job temp directory with isolated interpreters
#   (python -I), so no Python module in the checkout is imported while installing.
# - Read-only contents permission (none for CI Gate), no kept checkout token,
#   no secrets. Scanners and zizmor run under `env -i`, so no runner credential
#   reaches them. zizmor runs offline: its online audits (impostor commits,
#   known-vulnerable actions) need a token, and the action pins in pins.txt are
#   checked against their upstream tags instead.
# - Suppressions (.trufflehogignore, trufflehog:ignore, nosemgrep, noqa, Ruff
#   and zizmor configuration) are repository content and are reviewed in the
#   diff, like this workflow.
name: CI Gate

on:
  # Main-scope archives are visible to future PR and merge-queue refs.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# setup-python prefers the runner tool cache with check-latest disabled. The
# previous patch pins mirrored a source environment, not a patch-specific check.
# CPython 3.12 wheels and compileall work across 3.12 patch releases.
# Cache only verified release archives, never venvs or repository build outputs.
# Fork PRs restore only. No prefix restore keys.
env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.15.21"
  MYPY_VERSION: "2.1.0"
  ZIZMOR_VERSION: "1.31.1"
  PIP_AUDIT_VERSION: "2.10.1"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_RELEASE_ASSET_ID: "384924896"
  ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_RELEASE_ASSET_ID: "336391469"
  SHELLCHECK_LINUX_X86_64_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
  TRUFFLEHOG_VERSION: "3.99.0"
  TRUFFLEHOG_RELEASE_ASSET_ID: "616256576"
  TRUFFLEHOG_LINUX_AMD64_SHA256: e35ae3fd1e4b7a0c1699d0fda1814282bf906d03379bd4337b092b3a84c6740b
  SEMGREP_VERSION: "1.183.0"
  SEMGREP_RULES_COMMIT: 16b9e6d45f10649f6a531ec4838ed9924372c3bc

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Install Ruff (hash-pinned wheel)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          venv="$RUNNER_TEMP/ruff-venv"
          rm -rf "$venv"
          python -I -m venv "$venv"
          requirements="$RUNNER_TEMP/ruff-requirements.txt"
          cat > "$requirements" <<'REQUIREMENTS'
          ruff==0.15.21 \
              --hash=sha256:bab0905d2f29e0d9fbc3c373ed23db0095edaa3f71f1f4f519ec15134d9e85c8
          REQUIREMENTS
          "$venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement "$requirements"
          reported="$("$venv/bin/ruff" --version)"
          if [ "$reported" != "ruff ${RUFF_VERSION}" ]; then
            echo "::error::Expected ruff ${RUFF_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Ruff check lu_machinery/
        run: |
          set -euo pipefail
          ruff="$RUNNER_TEMP/ruff-venv/bin/ruff"
          if [ ! -d lu_machinery ]; then
            echo "::error::lu_machinery/ is missing; nothing would be checked"
            exit 1
          fi
          # Bootstrap lint settings: the source repository's pyproject.toml
          # [tool.ruff] table with scripts/ renamed to lu_machinery/. A config
          # file passed with --config applies to every file, its relative paths
          # resolve from the working directory, and any repository config is
          # ignored. Step 8 moves these settings into the machinery
          # pyproject.toml and drops this file and the --config flag.
          config="$RUNNER_TEMP/ruff-bootstrap.toml"
          cat > "$config" <<'TOML'
          line-length = 120
          target-version = "py312"
          src = [".", "lu_machinery"]
          exclude = [".venv/", "node_modules/", "starlight/", "lu_machinery/oneoff/"]

          [lint]
          select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF", "PLC0415"]
          ignore = ["RUF001", "RUF002", "RUF003", "E402", "E501", "E741"]

          [lint.per-file-ignores]
          "!lu_machinery/{api,project_api}/**.py" = ["PLC0415"]
          "lu_machinery/api/*.py" = ["B008"]
          "lu_machinery/project_api/*.py" = ["B008"]
          TOML
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          # The files Ruff itself selects, after the configured exclusions.
          inspected="$("$ruff" check --no-cache --config "$config" --show-files lu_machinery | grep -c . || true)"
          echo "Ruff inspects ${inspected} file(s); lu_machinery/ holds ${python_files} Python file(s)."
          if [ "$python_files" -eq 0 ] || [ "$inspected" -eq 0 ]; then
            echo "::error::Ruff would inspect no Python files in lu_machinery/"
            exit 1
          fi
          "$ruff" check --no-cache --config "$config" --output-format=github lu_machinery

  compileall:
    name: Compile (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Compile lu_machinery
        run: |
          set -euo pipefail
          reported="$(python -I -c 'import platform; print(platform.python_version())')"
          minor="$(python -I -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [ "$minor" != "$PYTHON_VERSION" ]; then
            echo "::error::Expected Python ${PYTHON_VERSION}, got: ${reported}"
            exit 1
          fi
          if [ ! -d lu_machinery ]; then
            echo "::error::lu_machinery/ is missing; nothing would be compiled"
            exit 1
          fi
          # compileall -q exits 0 on a missing or empty directory, so count first.
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          if [ "$python_files" -eq 0 ]; then
            echo "::error::lu_machinery/ holds no Python files; nothing would be compiled"
            exit 1
          fi
          # Bytecode goes to the job temp directory, not the checkout, and its
          # count proves compileall reached every file. The prefix mirrors each
          # source's absolute directory and also receives the interpreter's own
          # stdlib bytecode, so only the mirror of lu_machinery/ is counted.
          prefix="$RUNNER_TEMP/pycache"
          rm -rf "$prefix"
          python -I -X pycache_prefix="$prefix" -m compileall -q lu_machinery
          mirror="${prefix}${PWD}/lu_machinery"
          if [ ! -d "$mirror" ]; then
            echo "::error::compileall wrote no bytecode for lu_machinery/"
            exit 1
          fi
          compiled="$(find "$mirror" -type f -name '*.pyc' | wc -l)"
          echo "Compiled ${compiled} of ${python_files} Python file(s) with Python ${reported}."
          if [ "$compiled" -ne "$python_files" ]; then
            echo "::error::compileall produced ${compiled} bytecode file(s) for ${python_files} source file(s)"
            exit 1
          fi

      - name: Remove bytecode
        if: always()
        run: rm -rf "$RUNNER_TEMP/pycache"

  mypy:
    name: mypy ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ratchet's shrink check reads the baseline at HEAD^ as well as
          # HEAD and origin/main, and silently skips a ref it cannot read.
          fetch-depth: 2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Fetch origin/main for the shrink check
        run: |
          set -euo pipefail
          # No --depth: on a push to main the checkout is the main tip, and a
          # depth-1 fetch of it would move the shallow boundary to HEAD and
          # drop HEAD^. Without it, Git fetches only commits it does not have.
          git fetch --no-tags --no-recurse-submodules origin \
            +refs/heads/main:refs/remotes/origin/main
          # A ref the ratchet cannot read is skipped, not failed, so require all three.
          for ref in HEAD HEAD^ origin/main; do
            if ! git rev-parse --verify --quiet "${ref}^{commit}" > /dev/null; then
              echo "::error::${ref} is not available; the baseline shrink check would be skipped"
              exit 1
            fi
          done
          if ! git cat-file -e origin/main:lu_machinery/lint/mypy_baseline.json; then
            echo "::error::origin/main has no lu_machinery/lint/mypy_baseline.json; the shrink check would be skipped"
            exit 1
          fi

      - name: Install mypy and the lu_machinery import closure (hash-pinned wheels)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          venv="$RUNNER_TEMP/mypy-venv"
          rm -rf "$venv"
          python -I -m venv "$venv"
          requirements="$RUNNER_TEMP/mypy-requirements.txt"
          # mypy and the [project] dependency closure at the source repository's
          # requirements-lock.txt versions. Typed packages change the error census,
          # so mypy alone does not reproduce the baseline. See pins.txt.
          cat > "$requirements" <<'REQUIREMENTS'
