          REQUIREMENTS
          "$venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement "$requirements"
          mkdir -p "$venv/home"
          reported="$(env -i PATH="$venv/bin:/usr/bin:/bin" HOME="$venv/home" PYTHONSAFEPATH=1 \
            "$venv/bin/semgrep" --version)"
          if [ "$reported" != "$SEMGREP_VERSION" ]; then
            echo "::error::Expected semgrep ${SEMGREP_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Fetch semgrep-rules at the pinned commit
        run: |
          set -euo pipefail
          rules="$RUNNER_TEMP/semgrep-rules"
          rm -rf "$rules"
          git init --quiet "$rules"
          git -C "$rules" fetch --quiet --depth 1 --no-tags \
            https://github.com/semgrep/semgrep-rules.git "$SEMGREP_RULES_COMMIT"
          git -C "$rules" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
          checked_out="$(git -C "$rules" rev-parse HEAD)"
          if [ "$checked_out" != "$SEMGREP_RULES_COMMIT" ]; then
            echo "::error::semgrep-rules is at ${checked_out}, expected ${SEMGREP_RULES_COMMIT}"
            exit 1
          fi

      - name: Scan with Semgrep
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          rules="$RUNNER_TEMP/semgrep-rules"
          venv="$RUNNER_TEMP/semgrep-venv"
          configs=(
            python/lang
            python/correctness
            python/jinja2
            python/jwt
            python/requests
            python/sh
            generic/secrets
            bash/lang
            yaml/github-actions
            yaml/kubernetes
          )
          args=()
          for config in "${configs[@]}"; do
            dir="$rules/$config"
            if [ ! -d "$dir" ] || [ -z "$(find "$dir" -name '*.yaml' -print -quit)" ]; then
              echo "::error::Rule config ${config} is missing from the semgrep-rules checkout"
              exit 1
            fi
            args+=(--config "$dir")
          done

          work="$RUNNER_TEMP/sast"
          rm -rf "$work"
          mkdir -p "$work/home" "$work/tmp"
          results="$work/results.json"
          diagnostics="$work/stderr.log"
          # Scanner stderr can quote repository content, so it goes to a file
          # that is never printed; only its line count reaches the log.
          set +e
          env -i PATH="$venv/bin:/usr/bin:/bin" HOME="$work/home" TMPDIR="$work/tmp" \
            PYTHONSAFEPATH=1 SEMGREP_SEND_METRICS=off SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$venv/bin/semgrep" scan "${args[@]}" \
            --metrics=off --disable-version-check --error --timeout 30 --jobs 2 \
            --json --output "$results" --quiet . 2> "$diagnostics"
          rc=$?
          set -e
          echo "Semgrep exited ${rc}; $(wc -l < "$diagnostics") stderr line(s) withheld from this log."

          # Exactly one JSON object with results and errors arrays and a list of
          # scanned paths; anything else (missing file, other JSON, several
          # values) fails. jq's own error text can quote the input, so it is
          # discarded.
          if ! jq -s -e 'length == 1 and (.[0] | type == "object"
                and (.results | type) == "array" and (.errors | type) == "array"
                and (.paths.scanned | type) == "array")' \
                "$results" > /dev/null 2>&1; then
            echo "::error::Semgrep output is missing or malformed (exit ${rc}); failing closed"
            exit 1
          fi
          scanned="$(jq '.paths.scanned | length' "$results")"
          scanned_python="$(jq '[.paths.scanned[] | select(type == "string" and endswith(".py"))] | length' "$results")"
          echo "Semgrep scanned ${scanned} file(s), ${scanned_python} of them Python."
          if [ "$scanned" -eq 0 ] || [ "$scanned_python" -eq 0 ]; then
            echo "::error::Semgrep scanned no Python files; failing closed"
            exit 1
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::Semgrep exited ${rc} (scan error); failing closed"
            exit 1
          fi
          baseline=.github/workflows/semgrep-baseline.json
          checker=.github/workflows/semgrep_baseline.py
          if [ ! -f "$baseline" ] || [ ! -f "$checker" ]; then
            echo "::error::The Semgrep baseline or its checker is missing; failing closed"
            exit 1
          fi
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MQ_BASE" ;;
            push) base="$PUSH_BASE" ;;
            workflow_dispatch) base="" ;;
            *) echo "::error::Unsupported event ${EVENT_NAME}"; exit 1 ;;
          esac
          : > "$work/changed"
          if [ -n "$base" ]; then
            if ! git cat-file -e "${base}^{commit}"; then
              echo "::error::Base commit ${base} is not in the checkout; failing closed"
              exit 1
            fi
            git diff -z --no-renames --name-only "$base" HEAD > "$work/changed"
          fi
          python -I -B "$checker" check --results "$results" --root . --rules-dir "$rules" \
            --baseline "$baseline" --changed "$work/changed" --base "$base" \
            --semgrep-version "$SEMGREP_VERSION" --rules-commit "$SEMGREP_RULES_COMMIT" \
            --configs "${configs[*]}"

      - name: Remove scan results
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/sast" "$RUNNER_TEMP/semgrep-rules"
          "$RUNNER_TEMP/semgrep-venv" "$RUNNER_TEMP/semgrep-requirements.txt"

  # Blocking vulnerability audit of the release inputs, as the source
  # repository's dependency-audit job does it (pip-audit, then npm audit at
  # high and above), on every event.
  # - Python: pip-audit reads requirements-machinery.lock as written
  #   (--disable-pip --require-hashes: no resolver, no install) and fails on any
  #   known vulnerability; --strict also fails a pin it cannot look up. pip-audit
  #   silently drops a requirement whose environment marker is false on this
  #   runner, so its report must list exactly as many audited packages as the
  #   lock has pins.
  # - Node: npm audit reads package-lock.json only (--package-lock-only), every
  #   locked package with no --omit (a lock's dev flag cannot hide one), and
  #   fails on a high or critical advisory, or on any audit error.
  # - pip-audit and its dependency closure are hash-pinned wheels (pins.txt);
  #   npm is the hosted runner's. Both run under `env -i`.
  # - A suppression is an `--ignore-vuln ID` argument below with its reason,
  #   reviewed in the diff like every other suppression.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

