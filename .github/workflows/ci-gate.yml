        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Install pip-audit (hash-pinned wheels)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          venv="$RUNNER_TEMP/pip-audit-venv"
