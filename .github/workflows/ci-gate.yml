              --hash=sha256:c7372aae11c3c3f26a42df7bd626cec2f47d03483d261d369516a615a53714c6
          truststore==0.10.4 \
              --hash=sha256:adaeaecf1cbb5f4de3b1959b42d41f6fab57b2b1666adb59e89cb0b53361d981
          typing-extensions==4.16.0 \
              --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
          typing-inspection==0.4.4 \
              --hash=sha256:65b8397ba37ccbce054456aaccddfc91e6e3083c92824df348d96ca832f3f147
          uvicorn==0.48.0 \
              --hash=sha256:48097851328b87ec36117d3d575234519eb58c2b22d79666e9bbc6c49a761dad
          werkzeug==3.1.9 \
              --hash=sha256:6392e50c78460ba618e5b21f08a71f59c99ce99cdc6cf6e3dd7e6ccca8754fab
          REQUIREMENTS
          "$venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement "$requirements"
          "$venv/bin/python" -I -m pip check --disable-pip-version-check
          reported="$("$venv/bin/python" -I -m mypy --version)"
          case "$reported" in
            "mypy ${MYPY_VERSION} "*) ;;
            *)
              echo "::error::Expected mypy ${MYPY_VERSION}, got: ${reported}"
              exit 1
              ;;
          esac
          minor="$("$venv/bin/python" -I -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [ "$minor" != "$PYTHON_VERSION" ]; then
            echo "::error::Expected Python ${PYTHON_VERSION}, got: ${minor}"
            exit 1
          fi

      - name: Run the mypy ratchet over lu_machinery/
        env:
          LU_PRODUCT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mypy-venv"
          if [ ! -f lu_machinery/lint/mypy_baseline.json ]; then
            echo "::error::lu_machinery/lint/mypy_baseline.json is missing; nothing would be compared"
            exit 1
          fi
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          echo "The ratchet checks lu_machinery/, which holds ${python_files} Python file(s)."
          if [ "$python_files" -eq 0 ]; then
            echo "::error::lu_machinery/ holds no Python files; mypy would check nothing"
            exit 1
          fi
          # The same command the source repository's CI and pre-push hook run,
          # with this repository's package name. It imports the ratchet from
          # the checkout, so it does not run isolated (-I).
          LEARN_UKRAINIAN_PYTHON="$venv/bin/python" \
            env -u PYTHONPATH -u MYPYPATH "$venv/bin/python" -m lu_machinery.lint.mypy_ratchet

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore verified actionlint
        uses: ./.github/actions/cached-release-tool # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          tool: actionlint
          version: ${{ env.ACTIONLINT_VERSION }}
          sha256: ${{ env.ACTIONLINT_LINUX_AMD64_SHA256 }}
          repository: rhysd/actionlint
          asset-id: ${{ env.ACTIONLINT_RELEASE_ASSET_ID }}
          token: ${{ github.token }}
          member: actionlint

      - name: Restore verified ShellCheck
        uses: ./.github/actions/cached-release-tool # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          tool: shellcheck
          version: ${{ env.SHELLCHECK_VERSION }}
          sha256: ${{ env.SHELLCHECK_LINUX_X86_64_SHA256 }}
          repository: koalaman/shellcheck
          asset-id: ${{ env.SHELLCHECK_RELEASE_ASSET_ID }}
          token: ${{ github.token }}
          member: shellcheck-v${{ env.SHELLCHECK_VERSION }}/shellcheck
          strip-components: '1'

      - name: Verify actionlint and ShellCheck versions
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/actionlint"
          reported="$("$tool/actionlint" -version | head -n 1)"
          if [ "$reported" != "$ACTIONLINT_VERSION" ]; then
            echo "::error::Expected actionlint ${ACTIONLINT_VERSION}, got: ${reported}"
            exit 1
          fi
          reported="$("$RUNNER_TEMP/shellcheck/shellcheck" --version | sed -n 's/^version: //p')"
          if [ "$reported" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::Expected shellcheck ${SHELLCHECK_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: actionlint .github/workflows/
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/actionlint"
          if [ ! -d .github/workflows ]; then
            echo "::error::.github/workflows/ is missing; nothing would be linted"
            exit 1
          fi
          mapfile -t files < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) | LC_ALL=C sort)
          echo "actionlint inspects ${#files[@]} workflow file(s)."
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::.github/workflows/ holds no workflow files"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          # The pinned ShellCheck lints every run: script; pyflakes is disabled
          # so the result never depends on what the runner image ships.
          "$tool/actionlint" -shellcheck="$RUNNER_TEMP/shellcheck/shellcheck" -pyflakes= "${files[@]}"

      - name: ShellCheck .github/ shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find .github -type f -name '*.sh' | LC_ALL=C sort)
          echo "ShellCheck inspects ${#scripts[@]} shell script(s)."
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::.github/ holds no shell scripts; nothing would be checked"
            exit 1
          fi
          printf '  %s\n' "${scripts[@]}"
          "$RUNNER_TEMP/shellcheck/shellcheck" "${scripts[@]}"

      - name: Remove tools
        if: always()
        run: rm -rf "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/shellcheck"

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Install zizmor (hash-pinned wheel)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          venv="$RUNNER_TEMP/zizmor-venv"
          rm -rf "$venv"
          python -I -m venv "$venv"
          requirements="$RUNNER_TEMP/zizmor-requirements.txt"
          cat > "$requirements" <<'REQUIREMENTS'
          zizmor==1.31.1 \
              --hash=sha256:58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410
          REQUIREMENTS
          "$venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement "$requirements"
          reported="$("$venv/bin/zizmor" --version)"
          if [ "$reported" != "zizmor ${ZIZMOR_VERSION}" ]; then
            echo "::error::Expected zizmor ${ZIZMOR_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: zizmor workflows and local actions
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/zizmor-venv"
          if [ ! -d .github/workflows ]; then
            echo "::error::.github/workflows/ is missing; nothing would be audited"
            exit 1
          fi
          mapfile -t files < <(find .github/workflows .github/actions -type f \
            \( -name '*.yml' -o -name '*.yaml' \) | LC_ALL=C sort)
          echo "zizmor audits ${#files[@]} workflow/action file(s) offline."
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::.github/workflows/ holds no workflow/action files"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          work="$RUNNER_TEMP/zizmor"
          rm -rf "$work"
          mkdir -p "$work/home"
          # Any finding (exit 10 and above) or tool error fails the job.
          env -i PATH=/usr/bin:/bin HOME="$work/home" \
            "$venv/bin/zizmor" --offline --no-progress --format=github "${files[@]}"

      - name: Remove tools
        if: always()
        run: rm -rf "$RUNNER_TEMP/zizmor" "$RUNNER_TEMP/zizmor-venv" "$RUNNER_TEMP/zizmor-requirements.txt"

  # Blocking secret scan with the pinned TruffleHog CLI (pins.txt).
  # - pull_request, merge_group and main pushes scan the commits between base and head;
  #   workflow_dispatch scans the full history of the dispatched ref.
  # - Verified, unknown and unverified results are reported (pins.txt records
  #   why). Findings fail the job (exit 183), and so do scanner errors
  #   (--fail-on-scan-errors), any other non-zero exit, unparsable output and
  #   results arriving with a zero exit.
  # - The CLI is the checksum-verified release binary, not a container, run
  #   with the command line of the pinned upstream action script (pins.txt).
  # - The job also fails when the range holds no commit, or when the root
  #   .trufflehogignore is missing or leaves no Python or workflow file in scope.
  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # For the exclusion coverage check only; the scanner is a Go binary.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Restore verified TruffleHog
        uses: ./.github/actions/cached-release-tool # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          tool: trufflehog
          version: ${{ env.TRUFFLEHOG_VERSION }}
          sha256: ${{ env.TRUFFLEHOG_LINUX_AMD64_SHA256 }}
          repository: trufflesecurity/trufflehog
          asset-id: ${{ env.TRUFFLEHOG_RELEASE_ASSET_ID }}
          token: ${{ github.token }}
          member: trufflehog

      - name: Verify TruffleHog version
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/trufflehog"
          reported="$("$tool/trufflehog" --version 2>&1)"
          if [ "$reported" != "trufflehog ${TRUFFLEHOG_VERSION}" ]; then
            echo "::error::Expected trufflehog ${TRUFFLEHOG_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.event.after }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$MQ_BASE"; head="$MQ_HEAD" ;;
            push) base="$PUSH_BASE"; head="$PUSH_HEAD" ;;
            workflow_dispatch) base=""; head="$(git rev-parse HEAD)" ;;
            *) echo "::error::Unsupported event ${EVENT_NAME}"; exit 1 ;;
          esac
          for rev in $base $head; do
            if ! git cat-file -e "${rev}^{commit}"; then
              echo "::error::Commit ${rev} is not in the checkout; nothing was scanned"
              exit 1
            fi
          done
          if [ -n "$base" ] && [ "$base" = "$head" ]; then
            echo "::error::Base and head are the same commit; nothing would be scanned"
            exit 1
          fi
          if [ -n "$base" ]; then
            commits="$(git rev-list --count "${base}..${head}")"
          else
            commits="$(git rev-list --count "$head")"
          fi
          echo "Scanning ${commits} commit(s) up to ${head}."
          if [ "$commits" -eq 0 ]; then
            echo "::error::No commits between base and head; nothing would be scanned"
            exit 1
          fi

          work="$RUNNER_TEMP/secret-scan"
          rm -rf "$work"
          mkdir -p "$work/home" "$work/tmp"
          findings="$work/findings.jsonl"

          # Exclusion coverage. TruffleHog reports no per-file coverage, so the
          # exclusions are applied here to the head tree the way TruffleHog
          # 3.99.0 applies them (pkg/common/filter.go and pkg/sources/git/git.go:
          # comment and blank lines are skipped, every other line is a regular
          # expression searched in the repository-relative path, and a match
          # skips the file). The job fails unless Python and workflow files
          # remain in scope. Patterns are limited to a syntax subset that
          # Python's re (ASCII mode) and Go's regexp read the same way; any
          # other pattern fails the job. Only counts and line numbers are
          # printed. Files changed in the scanned range are counted for the
          # log only: a pull request that changes only documentation, or only
          # deletes files, is still scanned and can pass.
          ignore="${GITHUB_WORKSPACE}/.trufflehogignore"
          if [ ! -f "$ignore" ]; then
            echo "::error::.trufflehogignore is missing at the repository root; the scan cannot run"
            exit 1
          fi
          git ls-tree -r -z --name-only "$head" > "$work/head-paths"
          if [ -n "$base" ]; then
            git diff -z --name-only --no-renames --diff-filter=d "$base" "$head" > "$work/range-paths"
          else
            : > "$work/range-paths"
          fi
          python -I - "$ignore" "$work/head-paths" "$work/range-paths" "${base:+range}" <<'PY'
          import re
          import sys

          # Escapes both engines read alike; groups with flags, POSIX classes,
          # {,n} (a quantifier in Python, a literal in Go), \s and \S (Python's
          # ASCII \s also matches \v, Go's does not) and non-ASCII text are
          # refused.
          ESCAPES = set(".^$*+?()[]{}|\\/-dDwW")
          # Go's \s is [\t\n\f\r ]; Go's line scanner drops one trailing \r.
          SKIP = re.compile(r"[\t\n\f\r ]*(#|$)")

          def supported(line):
              if any(not " " <= c <= "~" for c in line) or "(?" in line or "[:" in line or "{," in line:
                  return False
              i = 0
              while i < len(line):
                  if line[i] == "\\":
                      if i + 1 == len(line) or line[i + 1] not in ESCAPES:
                          return False
                      i += 2
                  else:
                      i += 1
              return True

          rules = []
          with open(sys.argv[1], encoding="utf-8") as stream:
              lines = stream.read().split("\n")
          for number, line in enumerate(lines, 1):
              line = line.removesuffix("\r")
              if SKIP.match(line):
                  continue
              rule = None
              if supported(line):
                  try:
                      rule = re.compile(line, re.ASCII)
                  except re.error:
                      rule = None
              if rule is None:
                  print(f"::error::.trufflehogignore line {number} uses regular expression syntax this check does not support")
                  sys.exit(1)
              rules.append(rule)

          def paths(name):
              with open(name, "rb") as stream:
                  return [p.decode("utf-8", "surrogateescape") for p in stream.read().split(b"\0") if p]

          def kept(items):
              return [p for p in items if not any(rule.search(p) for rule in rules)]

          tree = paths(sys.argv[2])
          python = [p for p in tree if p.endswith(".py")]
          workflows = [p for p in tree if re.fullmatch(r"\.github/workflows/[^/]+\.ya?ml", p)]
          kept_python, kept_workflows = kept(python), kept(workflows)
          print(f"Exclusions: {len(rules)} pattern(s). In scope at head: {len(kept_python)} of"
                f" {len(python)} Python file(s), {len(kept_workflows)} of {len(workflows)} workflow file(s).")
          if sys.argv[4]:
              changed = paths(sys.argv[3])
              print(f"Files added or modified in the range: {len(kept(changed))} of {len(changed)} in scope.")
          if not kept_python or not kept_workflows:
              print("::error::The exclusions leave no Python or no workflow files in scope; failing closed")
              sys.exit(1)
          PY
          args=(
            git "file://${GITHUB_WORKSPACE}"
            --branch "$head"
            --fail --no-update --json
            "--results=verified,unknown,unverified"
            --exclude-detectors=Lob
            --fail-on-scan-errors
            --exclude-paths="${GITHUB_WORKSPACE}/.trufflehogignore"
          )
          if [ -n "$base" ]; then
            args+=(--since-commit "$base")
          fi

          diagnostics="$work/stderr.log"
          # Scanner stderr can quote repository content (an ignore-file entry,
          # for example), so it goes to a file that is never printed. Only its
          # line count and the numeric fields of the final summary reach the log.
          set +e
          env -i PATH=/usr/bin:/bin HOME="$work/home" TMPDIR="$work/tmp" \
            "$RUNNER_TEMP/trufflehog/trufflehog" "${args[@]}" > "$findings" 2> "$diagnostics"
          rc=$?
          set -e
          echo "TruffleHog exited ${rc}; $(wc -l < "$diagnostics") stderr line(s) withheld from this log."
          jq -R -r 'fromjson? | select(type == "object" and .msg == "finished scanning")
            | [("chunks", "bytes", "verified_secrets", "unverified_secrets") as $k
               | "\($k)=\(.[$k] | if type == "number" then tostring else "?" end)"]
            | "Scan summary: " + join(" ")' "$diagnostics" 2> /dev/null || true

          # jq's own error text can quote the input, so it is discarded.
          if ! count="$(jq -s 'length' "$findings" 2> /dev/null)"; then
            echo "::error::TruffleHog output is not valid JSON (exit ${rc}); failing closed"
            exit 1
          fi
          if [ "$count" -gt 0 ]; then
            echo "::error::TruffleHog reported ${count} finding(s). Secret values are redacted from this log."
            # Location fields only, each a string, number or boolean; Raw, RawV2,
            # Redacted and ExtraData never reach the log.
            jq -r 'def s: if type == "string" or type == "number" or type == "boolean" then tostring else "?" end;
              .SourceMetadata.Data.Git as $git
              | "::error::TruffleHog \(.DetectorName | s) verified=\(.Verified | s)"
              + " \($git.file | s):\($git.line | s) commit=\($git.commit | s)"' \
              "$findings" 2> /dev/null || echo "::error::Finding locations could not be summarized"
          fi
          case "$rc" in
            0)
              if [ "$count" -ne 0 ]; then
                echo "::error::Findings were reported with exit 0; failing closed"
                exit 1
              fi
              echo "No secrets found."
              ;;
            183)
              exit 1
              ;;
            *)
              echo "::error::TruffleHog exited ${rc} (scan error); failing closed"
              exit 1
              ;;
          esac

      - name: Remove scan results
        if: always()
        run: rm -rf "$RUNNER_TEMP/secret-scan" "$RUNNER_TEMP/trufflehog"

  # Blocking SAST with the pinned Semgrep CE and the semgrep/semgrep-rules
  # checkout at the pinned commit (pins.txt).
  # - Rules come only from local directories of that checkout. No registry name
  #   (p/..., r/..., auto) is used, so nothing is fetched from semgrep.dev and
  #   metrics stay off. A missing checkout, a commit mismatch or a missing or
  #   empty rule directory fails the job.
  # - Diff-aware against .github/workflows/semgrep-baseline.json, the reviewed
  #   baseline of the first push (semgrep_baseline.py beside it): a finding not
  #   in the baseline fails the job, and so does a scan error without a path.
  #   A scan error in a file the change touches passes only when each of its
  #   spans lies on lines the PR diff leaves unchanged and the baseline records
  #   the same error (path, error type, span text hash), at most as many times
  #   as recorded; a timeout, an error without spans and any span on an added
  #   or modified line fail. A missing or mismatched baseline or rules
  #   checkout, unparsable output, any exit other than 0 or 1, and a scan that
  #   covered no Python file fail closed. Scan errors in untouched files are
  #   warnings. --timeout 30 and --jobs 2 are explicit; --strict is not used
  #   because the checker judges every error.
  # - Exclusions: Semgrep's built-in ignore list applies while the repository
  #   has no .semgrepignore (it skips test/, tests/, vendor/, build/, dist/ and
  #   similar), and files over 1 MB are skipped (Semgrep's default
  #   --max-target-bytes). prepublication-gate.sh allows exactly these two skip
  #   reasons and refuses a .semgrepignore anywhere in the history.
  # - The scanner runs with PYTHONSAFEPATH=1, so no Python module in the
  #   checkout is imported. Suppressions (.semgrepignore, nosemgrep comments)
  #   are repository content and are reviewed in the diff, like this workflow.
  sast:
    name: SAST (Semgrep CE)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Install Semgrep (hash-pinned wheels)
        run: |
          set -euo pipefail
          # Run from the job temp directory with isolated interpreters (-I), so a
          # venv.py, pip.py or other module in the checkout is never imported.
          cd "$RUNNER_TEMP"
          venv="$RUNNER_TEMP/semgrep-venv"
          rm -rf "$venv"
          python -I -m venv "$venv"
          requirements="$RUNNER_TEMP/semgrep-requirements.txt"
          cat > "$requirements" <<'REQUIREMENTS'
          annotated-types==0.8.0 \
              --hash=sha256:f072f4d804ea359e4eaf198b1af7a8b0943881a87f31bb764f8bf219bb9419e0
          anyio==4.16.0 \
              --hash=sha256:c66ae634e0b8228396b801741beb3294326d4b6102f7bba4041c0dfb58c29026
          attrs==26.1.0 \
              --hash=sha256:c647aa4a12dfbad9333ca4e71fe62ddc36f4e63b2d260a37a8b83d2f043ac309
          boltons==21.0.0 \
              --hash=sha256:b9bb7b58b2b420bbe11a6025fdef6d3e5edc9f76a42fb467afe7ca212ef9948b
          bracex==3.2.1 \
              --hash=sha256:e8622d46b60ef6062b4091033f97a304e1b205e70c0285743c5038b73886a47e
          certifi==2026.10.23 \
              --hash=sha256:e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1
          cffi==2.1.1 \
              --hash=sha256:c1453022f490d2459a11819d83ad1d586e9ff65a12ac3e705ffebd46d3685dcf \
              --hash=sha256:b0431303acaea1089ad4b3e9ce4e6518193def1118d4073ca848635ee4ea2e96
          charset-normalizer==3.5.2 \
              --hash=sha256:3d31298449090ab8d47b7b1b2a555ff73cac7ed438a08b7ac160980c7ebed649 \
              --hash=sha256:1c50fe28bbc2ced33386f298650d91218076c05420e6cbd790b913adc41659e7 \
              --hash=sha256:b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685
          click==8.4.2 \
