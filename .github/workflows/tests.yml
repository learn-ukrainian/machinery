# Machinery tests (machinery-move contract v3 step 8, first and second tranches).
#
# The `pytest` job runs every [run] file of tests/machinery_tests.txt as a
# whole file. The manifest is the only list: the job never discovers tests by
# itself, and it fails when the manifest is malformed, names anything but a
# tracked regular file under tests/ (a symlink or gitlink is refused), or
# lists no [run] file.
#
# - The job is a matrix of shards. Each shard gives the validated [run] list
#   to lu_machinery.ci.split_tests (the source repository's ci.yml pattern):
#   whole files, longest first onto the least-loaded shard, weighted by
#   lu_machinery/ci/pytest-file-durations.json, with an unweighted file
#   at the median. Every shard computes every slice and fails unless the
#   slices partition the [run] list exactly, with no shard empty, so a file is
#   never dropped and never runs twice. No file is pinned to a shard
#   (--history /dev/null), because every shard has the same shallow checkout.
#   Weights change only the balance, never which files run.
# - Shard count: in merge-group run 42600042639 the single job's pytest step
#   took 35m43s, and setup took under a minute. PR run 42621177146 measured
#   8,647 test-seconds over the 685 [run] files (the committed weights). That
#   is 1,441 s per shard over six shards. A shard there ran 1,458 s in 8m24s
#   of wall time, so each shard should take about 8.5 minutes, under the
#   20-minute shard limit with room for suite growth. Add shards when the
#   slowest shard nears 12 minutes.
# - Each shard prints its per-file seconds (`split_tests durations` over its
#   JUnit report). To refresh the weights, merge the six objects from one
#   successful merge-group run into pytest-file-durations.json.
# - `pytest shards` needs the matrix and runs always(). It fails unless every
#   shard succeeded, so a failed, cancelled or skipped shard fails this
#   workflow, and with it ci-gate.yml's `pytest` job.
#
# - Dependencies are hash-pinned wheels (pip --require-hashes
#   --only-binary=:all:) in a fresh venv alongside the head-built package.
#   Test dependency versions are the source repository's
#   requirements-lock.txt pins at the snapshot commit, resolved for CPython
#   3.12 on x86_64 Linux (uv pip compile with that lock as constraints); each
#   hash is the one wheel pip selects on ubuntu-24.04, checked against the
#   PyPI hashes of that resolution. Bump them together and rerun the job.
# - pytest settings mirror the source repository's [tool.pytest.ini_options]
#   where they apply to these files (timeout 120 s with the thread method,
#   faulthandler off, DeprecationWarning ignored); addopts is cleared so no
#   configuration file can select, deselect or skip what the manifest lists.
# - pytest-xdist distributes tests across the runner's CPUs. A recorder in
#   every worker keeps every item before any hook can deselect or drop it;
#   the controller checks their inventories agree and records every report.
#   The job fails on a nonzero exit, no collected test, any deselection,
#   collection error, failure, error or
#   unexpected pass, a node id collected twice, an outcome for a node never
#   collected, a repeated execution report, a collected test that never ran
#   or whose node id is not under a listed file (`<path>::`), and a [run]
#   file with no passed test.
# - Read-only contents permission, no kept checkout token, no secrets. Tests
#   run under `env -i` with a temporary HOME and TMPDIR, so no runner
#   credential or user configuration reaches them, and with isolated
#   interpreters (python -I -B). PATH is /usr/bin:/bin plus a directory that
#   holds only node and npm symlinks, the launcher fixture's toolchain.
# - Every shard starts its own runner PostgreSQL 16 cluster for the Postgres-marked tests
#   (lu_machinery/ci/test_env.sh start postgres, then wait). Its DSN is passed
#   through `env -i`; lu_machinery.ci.pg_skip_guard then fails the job when a
#   test skipped on the DSN or a Postgres test file has no passing test.
# - Hosted runner only (ubuntu-24.04). ci-gate.yml calls this workflow as its
#   `pytest` job, so it runs on that workflow's events under its concurrency,
#   and the required CI Gate check fails unless `pytest` succeeds.
name: Tests

on:
  workflow_call:

permissions: {}

env:
  PYTHON_VERSION: "3.12"
  MANIFEST: tests/machinery_tests.txt

jobs:
  pytest:
    name: pytest (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # About 6 minutes per shard at the measured suite (see the header).
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The runner's PostgreSQL 16 cluster, started below. Fleet Comms tests
      # marked `postgres` self-skip without a usable DSN; the guard step fails
      # the job if any did.
      LEARN_UKRAINIAN_CP_PG_DSN: postgresql://postgres:postgres@localhost:5432/lu
    strategy:
      # Every shard reports, so one failure does not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PostgreSQL 16 and bubblewrap start in the background during the Python
      # installs below; `wait` blocks until the server answers on the DSN.
      - run: bash lu_machinery/ci/test_env.sh start postgres

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false

      - name: Install test dependencies (hash-pinned wheels)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          venv="$RUNNER_TEMP/test-venv"
          rm -rf "$venv"
          python -I -m venv "$venv"
          requirements="$RUNNER_TEMP/test-requirements.txt"
          cat > "$requirements" <<'REQUIREMENTS'
          annotated-doc==0.0.5 \
              --hash=sha256:117bac03a25ede5df5440e855b32d556049ca169ead221505badf432fed4b101
          annotated-types==0.8.0 \
              --hash=sha256:f072f4d804ea359e4eaf198b1af7a8b0943881a87f31bb764f8bf219bb9419e0
          fastapi==0.139.0 \
              --hash=sha256:cf15e1e9e667ddb0ad63811e60bd11390d1aac838ca4a7a23f421807b2308189
          pydantic==2.13.5 \
              --hash=sha256:346a034f080da3755d8e9cb5e00e8b07de1d39e4f6e2c87d8ab7cafa0b269a73
          pydantic-core==2.46.5 \
              --hash=sha256:0fc5be0abd4a407e200d844b404e33639a554e7bd0d448e7b9ae181be4789ac2
          starlette==1.3.1 \
              --hash=sha256:c7372aae11c3c3f26a42df7bd626cec2f47d03483d261d369516a615a53714c6
          typing-inspection==0.4.4 \
              --hash=sha256:65b8397ba37ccbce054456aaccddfc91e6e3083c92824df348d96ca832f3f147
          anyio==4.15.1 \
              --hash=sha256:6152fdbbf9a77fdec97731721bebf7c4c44f7c29b424b0065826173efc7ed101
          attrs==26.1.0 \
              --hash=sha256:c647aa4a12dfbad9333ca4e71fe62ddc36f4e63b2d260a37a8b83d2f043ac309
          cffi==2.1.1 \
              --hash=sha256:c1453022f490d2459a11819d83ad1d586e9ff65a12ac3e705ffebd46d3685dcf
          coverage==7.17.0 \
              --hash=sha256:85932227e9dd38e62cd29c17fefdfecfb919eead6af1e3259522d03cf85de983
          cryptography==50.0.2 \
              --hash=sha256:9dab55f57c74c3cad24c323bacbbd04be4705ba6eb0d92e920b1fc4837ed5079
          idna==3.20 \
              --hash=sha256:ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
          iniconfig==2.3.0 \
              --hash=sha256:f631c04d2c48c52b84d0d0549c99ff3859c98df65b3101406327ecc7d53fbf12
          jsonschema==4.26.0 \
              --hash=sha256:d489f15263b8d200f8387e64b4c3a75f06629559fb73deb8fdfb525f2dab50ce
          jsonschema-specifications==2025.9.1 \
              --hash=sha256:98802fee3a11ee76ecaca44429fda8a41bff98b00a0f2838151b113f210cc6fe
          markdown-it-py==4.2.0 \
              --hash=sha256:9f7ebbcd14fe59494226453aed97c1070d83f8d24b6fc3a3bcf9a38092641c4a
          mdurl==0.1.2 \
              --hash=sha256:84008a41e51615a49fc9966191ff91509e3c40b939176e643fd50a5c2196b8f8
          packaging==26.3 \
              --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pluggy==1.6.0 \
              --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          psutil==7.2.2 \
              --hash=sha256:076a2d2f923fd4821644f5ba89f059523da90dc9014e85f8e45a5774ca5bc6f9
          pycparser==3.0 \
              --hash=sha256:b727414169a36b7d524c1c3e31839a521725078d7b2ff038656844266160a992
          pygments==2.21.0 \
              --hash=sha256:2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9
          pyjwt==2.15.0 \
              --hash=sha256:7a3742debf6b879e912dbb9819ceec1594be812452b78c5f2e2dfc56564954f8
          pytest==9.1.1 \
              --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c
          pytest-cov==7.1.0 \
              --hash=sha256:a0461110b7865f9a271aa1b51e516c9a95de9d696734a2f71e3e78f46e1d4678
          pytest-rerunfailures==16.7 \
              --hash=sha256:edf1886209c2b7dafe35b5bf1708d6ec40ccf6c6b357f0f02807efcec0204c99
          pytest-timeout==2.4.0 \
              --hash=sha256:c42667e5cdadb151aeb5b26d114aff6bdf5a907f176a007a30b940d3d865b5c2
          pyyaml==6.0.3 \
              --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc
          referencing==0.37.0 \
              --hash=sha256:381329a9f99628c9069361716891d34ad94af76e461dcb0335825aecc7692231
          rpds-py==0.30.0 \
              --hash=sha256:47f236970bccb2233267d89173d3ad2703cd36a0e2a6e92d0560d333871a3d23
          typing-extensions==4.16.0 \
              --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
          ast-serialize==0.12.1 \
              --hash=sha256:50a9eaedf1db4857dad7cc47dd757ed70bfcc40b89d44d516c4a2f0d5033bd76
          librt==0.16.0 \
              --hash=sha256:36e53948e99bbe3ffea257124cfcae1cfb01831555c9a9c903c9f9a72db7fd07
          mypy==2.1.0 \
              --hash=sha256:bf03e12003084a67395184d3eb8cbd6a489dc3655b5664b28c210a9e2403ab0b
          mypy-extensions==1.1.0 \
              --hash=sha256:1be4cccdb0f2482337c4743e60421de3a356cd97508abadd57d47403e94f5505
          pathspec==1.1.1 \
              --hash=sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
          REQUIREMENTS
          "$venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement "$requirements"
          "$venv/bin/python" -I -m pip check --disable-pip-version-check
          reported="$("$venv/bin/python" -I -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')"
          minor="$("$venv/bin/python" -I -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [ "$minor" != "$PYTHON_VERSION" ]; then
            echo "::error::Expected Python ${PYTHON_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Build sdist and wheel with pinned tools
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          rm -rf "$work"
          mkdir -p "$work/src" "$work/dist"
          # Only tracked files, as in a release build.
          git archive --format=tar HEAD | tar -x -C "$work/src"
          cd "$work"
          python -I -m venv build-venv
          cat > build-requirements.txt <<'REQUIREMENTS'
          build==1.6.1 \
              --hash=sha256:ecd351a4be9d35a9eaaba244a7687143c9c7d4aea6ac964e7e7ddab20cbcf4e7
          packaging==26.3 \
              --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pyproject-hooks==1.2.0 \
              --hash=sha256:9e5c6bfa8dcc30091c74b0cf803c81fdd29d94f01992a7707bc97babb1141913
          setuptools==84.1.0 \
              --hash=sha256:5231689c6ac8156cd155cfb98c3fd6fb252c3e7e9bd3d78b64d3c55f132624c9
          REQUIREMENTS
          build-venv/bin/python -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement build-requirements.txt
          build-venv/bin/python -I -m build --sdist --wheel --no-isolation --outdir dist src
          ls -l dist
          wheels="$(find dist -maxdepth 1 -name 'lu_machinery-*-py3-none-any.whl' | wc -l)"
          sdists="$(find dist -maxdepth 1 -name 'lu_machinery-*.tar.gz' | wc -l)"
          if [ "$wheels" -ne 1 ] || [ "$sdists" -ne 1 ]; then
            echo "::error::Expected one wheel and one sdist, got ${wheels} and ${sdists}"
            exit 1
          fi

      - name: Install offline from a hash-locked wheelhouse
        run: |
          set -euo pipefail
          lock="$PWD/requirements-machinery.lock"
          work="$RUNNER_TEMP/installed-wheel"
          cd "$work"
          wheel="$(find dist -maxdepth 1 -name 'lu_machinery-*-py3-none-any.whl')"
          version="$(python -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' src/pyproject.toml)"
          mkdir wheelhouse
          python -I -m pip download --no-cache-dir --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: --no-deps --dest wheelhouse --requirement "$lock"
          cp "$wheel" wheelhouse/
          # The consumer lock: the release line, then the dependency lock.
          digest="$(sha256sum "$wheel" | cut -d' ' -f1)"
          { printf 'lu-machinery==%s \\\n    --hash=sha256:%s\n' "$version" "$digest"; cat "$lock"; } > consumer.lock
          echo "lu-machinery ${version} sha256:${digest}; wheelhouse holds $(find wheelhouse -name '*.whl' | wc -l) wheel(s)"
          "$RUNNER_TEMP/test-venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check --no-input \
            --no-index --find-links wheelhouse --require-hashes --requirement consumer.lock
          "$RUNNER_TEMP/test-venv/bin/python" -I -m pip check --disable-pip-version-check

      - name: Read the [run] files from the manifest
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pytest"
          rm -rf "$work"
          mkdir -p "$work/home" "$work/tmp"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::${MANIFEST} is missing; nothing would be tested"
            exit 1
          fi
          # Index entries with their modes, so a tracked symlink or gitlink is
          # never taken for a test file.
          git ls-files -s -z -- tests > "$work/tracked"
          python -I -B - "$MANIFEST" "$work/tracked" "$work/all-run-files" <<'PY'
          import os
          import re
          import stat
          import sys

          manifest, tracked_list, out = sys.argv[1:]
          tracked = {}  # path -> index mode
          with open(tracked_list, "rb") as handle:
              for raw in handle.read().split(b"\0"):
                  if raw:
                      meta, path = raw.decode("utf-8").split("\t", 1)
                      tracked[path] = meta.split()[0]
          sections = {"run": [], "support": [], "held": []}
          order = ["run", "support", "held"]
          current = None
          seen = set()
          problems = []
          with open(manifest, encoding="utf-8") as handle:
              for number, line in enumerate(handle.read().splitlines(), 1):
                  header = re.fullmatch(r"# \[(\w+)\]", line)
                  if header:
                      name = header.group(1)
                      if not order or name != order[0]:
                          problems.append(f"line {number}: section [{name}] is unknown or out of order")
                          break
                      order.pop(0)
                      current = name
                      continue
                  if not line.strip() or line.startswith("#"):
                      continue
                  if current not in ("run", "support"):
                      problems.append(f"line {number}: a path outside [run] or [support]: {line!r}")
                      continue
                  if line != line.strip() or line in seen:
                      problems.append(f"line {number}: {line!r} has surrounding space or is listed twice")
                      continue
                  seen.add(line)
                  try:
                      on_disk = os.lstat(line).st_mode
                  except OSError:
                      on_disk = 0
                  if tracked.get(line) not in ("100644", "100755") or not stat.S_ISREG(on_disk):
                      problems.append(f"line {number}: {line} is not a tracked regular file under tests/")
                  if current == "run" and not re.fullmatch(r"tests/(?:[\w-]+/)*test_\w+\.py", line):
                      problems.append(f"line {number}: [run] entry {line} is not a tests/**/test_*.py file")
                  sections[current].append(line)
          if order:
              problems.append(f"sections missing: {order}")
          if not sections["run"]:
              problems.append("the [run] section lists no file")
          for problem in problems:
              print(f"::error file={manifest}::{problem}")
          if problems:
              sys.exit(1)
          unlisted = sorted(
              path
              for path in tracked
              if path not in seen and re.fullmatch(r"tests/(?:[\w-]+/)*test_\w+\.py", path)
          )
          for path in unlisted:
              print(f"::warning file={path}::{path} is not in {manifest}; the pytest job does not run it")
          # Sorted so every directory is contiguous: pytest binds a directory's
          # conftest fixtures to one collector node, and a directory split in
          # the argument list gets a second node without them.
          run_files = sorted(sections["run"])
          with open(out, "w", encoding="utf-8") as handle:
              handle.write("".join(f"{path}\n" for path in run_files))
          print(f"{len(sections['run'])} [run] file(s), {len(sections['support'])} [support] file(s).")
          for path in run_files:
              print(f"  {path}")
          PY

      - run: bash lu_machinery/ci/test_env.sh wait

      - name: Select this shard's [run] files
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pytest"
          # The installed wheel's splitter (-I keeps the checkout off sys.path)
          # reads the committed weights. Every slice is computed here, so this
          # shard can prove they partition the [run] list.
          for shard in $(seq 1 "$SHARDS"); do
            "$RUNNER_TEMP/test-venv/bin/python" -I -B -m lu_machinery.ci.split_tests split \
              --shard "$shard" --of "$SHARDS" --durations lu_machinery/ci/pytest-file-durations.json \
              --history /dev/null < "$work/all-run-files" > "$work/slice-$shard"
          done
          python -I -B - "$work" "$SHARD" "$SHARDS" <<'PY'
          import sys
          from pathlib import Path

          work, shard, shards = Path(sys.argv[1]), int(sys.argv[2]), int(sys.argv[3])
          listed = (work / "all-run-files").read_text(encoding="utf-8").splitlines()
          slices = [(work / f"slice-{k}").read_text(encoding="utf-8").splitlines() for k in range(1, shards + 1)]
          placed = [path for part in slices for path in part]
          problems = []
          if len(placed) != len(set(placed)):
              problems.append("a [run] file is in more than one shard")
          if set(placed) != set(listed):
              missing = sorted(set(listed) - set(placed))
              extra = sorted(set(placed) - set(listed))
              problems.append(f"the shards do not partition the [run] list: missing {missing[:10]}, extra {extra[:10]}")
          for number, part in enumerate(slices, 1):
              print(f"shard {number} of {shards}: {len(part)} file(s)")
              if not part:
                  problems.append(f"shard {number} has no file")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"{len(placed)} of {len(listed)} [run] file(s) placed, each in exactly one shard.")
          own = sorted(slices[shard - 1])
          # Sorted, so every directory stays contiguous (see the previous step).
          (work / "run-files").write_text("".join(f"{path}\n" for path in own), encoding="utf-8")
          print(f"This shard ({shard}) runs:")
          for path in own:
              print(f"  {path}")
          PY

      - name: pytest
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pytest"
          venv="$RUNNER_TEMP/test-venv"
          mapfile -t files < "$work/run-files"
          # Tests keep checkout fixtures and Git metadata, but no importable
          # source package. Child interpreters therefore resolve the wheel too.
          rm -rf lu_machinery "$RUNNER_TEMP/installed-wheel/src"
          LU_TEST_WHEEL="$(find "$RUNNER_TEMP/installed-wheel/dist" -name '*.whl')"
          # Install the temporary recorder beside pytest so isolated xdist
          # interpreters can load it with -p, without adding checkout code to
          # PYTHONPATH. Both serial and parallel runs use the same hooks.
          site_packages="$("$venv/bin/python" -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          cat > "$site_packages/machinery_ci_recorder.py" <<'PY'
          import shlex
          import sys

          import pytest


          class Recorder:
              def __init__(self):
                  self.collected = []
                  self.deselected = 0
                  self.collect_errors = 0
                  self.results = {}
                  self.reports = set()
                  self.repeated_reports = []
                  self.workers = {}
                  self.worker_problems = []

              @pytest.hookimpl(optionalhook=True)
              def pytest_xdist_setupnodes(self, config, specs):
                  # execnet otherwise starts workers without the controller's
                  # isolated/no-bytecode flags. Pin the same venv interpreter.
                  for spec in specs:
                      spec.python = shlex.join([sys.executable, "-I", "-B"])

              def pytest_itemcollected(self, item):
                  self.collected.append(item.nodeid)

              def pytest_collectreport(self, report):
                  if report.failed:
                      self.collect_errors += 1

              def pytest_deselected(self, items):
                  self.deselected += len(items)

              @pytest.hookimpl(wrapper=True, trylast=True)
              def pytest_sessionfinish(self, session):
                  # Ordinary finish hooks may change session.exitstatus.
                  # Capture it before xdist's outer finish wrapper sends output.
                  yield
                  if hasattr(session.config, "workeroutput"):
                      session.config.workeroutput["machinery_collection"] = {
                          "exit": int(session.exitstatus),
                          "collected": self.collected,
                          "deselected": self.deselected,
                          "collect_errors": self.collect_errors,
                      }

              @pytest.hookimpl(optionalhook=True)
              def pytest_xdist_node_collection_finished(self, node, ids):
                  self.workers[node.gateway.id] = list(ids)

              @pytest.hookimpl(optionalhook=True)
              def pytest_testnodedown(self, node, error):
                  output = getattr(node, "workeroutput", {})
                  worker = output.get("machinery_collection")
                  if error or worker is None:
                      self.worker_problems.append(f"{node.gateway.id}: missing collection evidence or worker error")
                      return
                  if output.get("exitstatus") != 0 or worker.get("exit") != 0:
                      self.worker_problems.append(f"{node.gateway.id}: worker session exited unsuccessfully")
                  collected = worker["collected"]
                  if not self.collected:
                      self.collected = collected
                  elif self.collected != collected:
                      self.worker_problems.append(f"{node.gateway.id}: pre-selection collections differ")
                  if sorted(self.workers.get(node.gateway.id, [])) != sorted(collected):
                      self.worker_problems.append(f"{node.gateway.id}: scheduled collection differs from original")
                  self.deselected += worker["deselected"]
                  self.collect_errors += worker["collect_errors"]

              def pytest_runtest_logreport(self, report):
                  node = report.nodeid
                  key = (node, report.when)
                  if key in self.reports:
                      self.repeated_reports.append(key)
                  self.reports.add(key)
                  xfail = hasattr(report, "wasxfail")
                  if report.when == "setup":
                      if report.failed:
                          self.results[node] = "errors"
                      elif report.skipped:
                          self.results[node] = "xfailed" if xfail else "skipped"
                  elif report.when == "call":
                      if xfail:
                          self.results[node] = "xfailed" if report.skipped else "xpassed"
                      else:
                          self.results[node] = report.outcome
                  elif report.failed:
                      self.results[node] = "errors"


          recorder = Recorder()


          def pytest_configure(config):
              config.pluginmanager.register(recorder, "machinery-recorder")
          PY
          runner="$work/run_pytest.py"
          cat > "$runner" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          import lu_machinery
          import pytest
          from machinery_ci_recorder import recorder

          origin = Path(lu_machinery.__file__).resolve()
          assert Path(sys.prefix).resolve() in origin.parents, origin
          print(f"parent wheel origin: {origin}", flush=True)
          child = subprocess.run(
              [sys.executable, "-c", "import lu_machinery; print(lu_machinery.__file__)"],
              check=True, capture_output=True, text=True,
          )
          child_origin = Path(child.stdout.strip()).resolve()
          assert child_origin == origin, child.stdout
          print(f"subprocess wheel origin: {child_origin}", flush=True)

          out, *args = sys.argv[1:]
          code = int(pytest.main(["-p", "machinery_ci_recorder", *args]))
          with open(out, "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "exit": code,
                      "collected": recorder.collected,
                      "deselected": recorder.deselected,
                      "collect_errors": recorder.collect_errors,
                      "results": recorder.results,
                      "repeated_reports": recorder.repeated_reports,
                      "worker_problems": recorder.worker_problems,
                  },
                  handle,
              )
          sys.exit(code)
          PY
          # tests/launcher_sandbox.py declares node, npm and git as the launcher
          # toolchain. git is in /usr/bin; the hosted image keeps Node in
          # /usr/local/bin, so only node and npm join PATH, as symlinks.
          toolchain="$work/toolchain"
          mkdir -p "$toolchain"
          for tool in node npm; do
            if ! found="$(command -v "$tool")"; then
              echo "::error::${tool} is not on the runner PATH; the launcher fixture needs it"
              exit 1
            fi
            ln -s "$found" "$toolchain/$tool"
          done
          set +e
          env -i PATH="/usr/bin:/bin:$toolchain" HOME="$work/home" TMPDIR="$work/tmp" LU_TEST_WHEEL="$LU_TEST_WHEEL" \
            LEARN_UKRAINIAN_CP_PG_DSN="$LEARN_UKRAINIAN_CP_PG_DSN" \
            LEARN_UKRAINIAN_PYTHON="$venv/bin/python" \
            "$venv/bin/python" -I -B "$runner" "$work/record.json" \
            -n logical --max-worker-restart=0 -p no:cacheprovider --rootdir="$PWD" \
            -o addopts= -o timeout=120 -o timeout_method=thread -o faulthandler_timeout=0 \
            -W ignore::DeprecationWarning -rfEs --tb=short --junitxml="$work/pytest.xml" "${files[@]}"
          rc=$?
          set -e
          python -I -B - "$work/record.json" "$rc" "${files[@]}" <<'PY'
          import json
          import sys

          record_path, rc, *files = sys.argv[1:]
          problems = []
          try:
              with open(record_path, encoding="utf-8") as handle:
                  record = json.load(handle)
          except (OSError, ValueError) as exc:
              print(f"::error::pytest (exit {rc}) wrote no readable run record: {exc}")
              sys.exit(1)
          # Outcomes are keyed by node id, so two collected items with one id
          # would let one outcome stand for both: refuse duplicates outright.
          counts = {}
          for node in record["collected"]:
              counts[node] = counts.get(node, 0) + 1
          duplicates = sorted(node for node, number in counts.items() if number > 1)
          collected = list(counts)
          results = record["results"]
          outcomes = {}
          for node in collected:
              if node in results:
                  outcomes[results[node]] = outcomes.get(results[node], 0) + 1
          print(f"pytest exit {rc}; collected {len(collected)}; outcomes {outcomes}")
          if rc != "0" or record["exit"] != 0:
              problems.append(f"pytest exited {rc}")
          if not collected:
              problems.append("pytest collected no test")
          if record["deselected"]:
              problems.append(f"{record['deselected']} test(s) were deselected; every listed test must run")
          if record["collect_errors"]:
              problems.append(f"{record['collect_errors']} collection error(s)")
          problems.extend(record["worker_problems"])
          if record["repeated_reports"]:
              problems.append(f"{len(record['repeated_reports'])} repeated execution report(s): {record['repeated_reports'][:10]}")
          if duplicates:
              problems.append(f"{len(duplicates)} node id(s) were collected more than once: {duplicates[:10]}")
          not_run = [node for node in collected if node not in results]
          if not_run:
              problems.append(f"{len(not_run)} collected test(s) never ran: {not_run[:10]}")
          unknown = [node for node in results if node not in counts]
          if unknown:
              problems.append(f"{len(unknown)} outcome(s) for test(s) never collected: {unknown[:10]}")
          for outcome in ("failed", "errors", "xpassed"):
              if outcomes.get(outcome):
                  problems.append(f"{outcomes[outcome]} test(s) {outcome}")
          owners = {path: [node for node in collected if node.startswith(path + "::")] for path in files}
          stray = [node for node in collected if not any(node.startswith(path + "::") for path in files)]
          if stray:
              problems.append(f"{len(stray)} collected test(s) belong to no [run] file: {stray[:10]}")
          for path, nodes in owners.items():
              passed = sum(1 for node in nodes if results.get(node) == "passed")
              print(f"  {path}: {len(nodes)} collected, {passed} passed")
              if not passed:
                  problems.append(f"{path}: no test of this [run] file passed")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Postgres tests must not skip
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pytest"
          "$RUNNER_TEMP/test-venv/bin/python" -I -B -m lu_machinery.ci.pg_skip_guard "$work/pytest.xml" \
            --title pytest | tee -a "$GITHUB_STEP_SUMMARY"

      # Input for refreshing lu_machinery/ci/pytest-file-durations.json (see the header).
      # It also runs after a failed test, so a slow failing shard is still measured.
      - name: Per-file seconds
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/pytest/pytest.xml"
          if [ ! -f "$report" ]; then
            echo "pytest wrote no JUnit report; no seconds to print"
            exit 0
          fi
          "$RUNNER_TEMP/test-venv/bin/python" -I -B -m lu_machinery.ci.split_tests durations "$report"

      - name: Remove test files
        if: always()
        run: rm -rf "$RUNNER_TEMP/pytest" "$RUNNER_TEMP/test-venv" "$RUNNER_TEMP/test-requirements.txt" "$RUNNER_TEMP/installed-wheel"

  pytest-shards:
    name: pytest shards
    needs: [pytest]
    # always(): a skipped or cancelled matrix must fail here, not pass unseen.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every shard to succeed
        env:
          RESULT: ${{ needs.pytest.result }}
        run: |
          echo "pytest shards: ${RESULT}"
          if [ "$RESULT" != "success" ]; then
            echo "::error::The pytest matrix finished with result ${RESULT}; every shard must succeed"
            exit 1
          fi
