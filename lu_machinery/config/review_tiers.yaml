# fnmatch patterns over repository-relative paths. Both names of a rename count.
# High wins over Ukrainian content, then Medium, then Low.
schema_version: 1
default: medium
tiers:
  high:
    - .github/**
    - .githooks/**
    - .pre-commit-config.yaml
    - .trufflehogignore
    - requirements*.txt
    - '**/requirements*.txt'
    - pyproject.toml
    - '**/pyproject.toml'
    - setup.py
    - '**/setup.py'
    - setup.cfg
    - '**/setup.cfg'
    - package.json
    - '**/package.json'
    - package-lock.json
    - '**/package-lock.json'
    - uv.lock
    - '**/uv.lock'
    - poetry.lock
    - '**/poetry.lock'
    - Pipfile*
    - '**/Pipfile*'
    - pnpm-lock.yaml
    - '**/pnpm-lock.yaml'
    - yarn.lock
    - '**/yarn.lock'
    - agents_extensions/*/hooks/**
    - agents_extensions/*/hooks*.json
    - agents_extensions/*/settings*.json
    - agents_extensions/*/config.toml
    - lu_machinery/session_streams/**
    - scripts/session_streams/**
    - start-*.sh
    - run-dispatcher.sh
    - services.sh
    - install*
    - lu_machinery/**/install*
    - scripts/**/install*
    - 'lu_machinery/start-*.sh'
    - 'scripts/start-*.sh'
    - 'lu_machinery/session_start.sh'
    - 'scripts/session_start.sh'
    - 'lu_machinery/install*'
    - 'scripts/install*'
    - 'lu_machinery/launchers/**'
    - 'scripts/launchers/**'
    - 'scripts/launchd/**'
    - 'lu_machinery/lib/*.sh'
    - 'scripts/lib/*.sh'
    - 'lu_machinery/hooks/**'
    - 'scripts/hooks/**'
    - 'lu_machinery/guardrails/**'
    - 'scripts/guardrails/**'
    - lu_machinery/pre_commit/**
    - scripts/pre_commit/**
    - 'lu_machinery/agent_runtime/**'
    - 'scripts/agent_runtime/**'
    - 'lu_machinery/session_supervisor/**'
    - 'scripts/session_supervisor/**'
    - 'lu_machinery/dispatch.py'
    - 'scripts/dispatch.py'
    - 'lu_machinery/dispatcher/**'
    - 'scripts/dispatcher/**'
    - 'lu_machinery/publish/**'
    - 'scripts/publish/**'
    - 'lu_machinery/opsec/**'
    - 'scripts/opsec/**'
    - 'lu_machinery/*credential*'
    - 'scripts/*credential*'
    - 'lu_machinery/*secret*'
    - 'scripts/*secret*'
    - 'lu_machinery/review/**'
    - 'scripts/review/**'
    - 'lu_machinery/ci/**'
    - 'scripts/ci/**'
    - 'lu_machinery/orchestration/integration_sweep.py'
    - 'scripts/orchestration/integration_sweep.py'
    - 'lu_machinery/orchestration/merge_queue_keeper.py'
    - 'scripts/orchestration/merge_queue_keeper.py'
    - 'lu_machinery/orchestration/dispatch_admission.py'
    - 'scripts/orchestration/dispatch_admission.py'
    - 'lu_machinery/api/delegate_router.py'
    - 'scripts/api/delegate_router.py'
    - 'lu_machinery/ai_agent_bridge/_review*.py'
    - 'scripts/ai_agent_bridge/_review*.py'
    - 'lu_machinery/ai_agent_bridge/routing_guard.py'
    - 'scripts/ai_agent_bridge/routing_guard.py'
    - 'lu_machinery/fleet_comms/review_publication.py'
    - 'scripts/fleet_comms/review_publication.py'
    - 'lu_machinery/fleet_comms/review_publisher.py'
    - 'scripts/fleet_comms/review_publisher.py'
    - 'lu_machinery/config/review_tiers.yaml'
    - 'scripts/config/review_tiers.yaml'
    - lu_machinery/config/review*.yaml
    - scripts/config/review*.yaml
    - lu_machinery/config/fleet_repos.yaml
    - scripts/config/fleet_repos.yaml
    - lu_machinery/config/*audit-ignore.yaml
    - scripts/config/*audit-ignore.yaml
    - 'lu_machinery/config/model_catalog.yaml'
    - 'scripts/config/model_catalog.yaml'
    - 'lu_machinery/config/agent_runtime*.yaml'
    - 'scripts/config/agent_runtime*.yaml'
    - 'lu_machinery/config/agent_fallback_substitutions.yaml'
    - 'scripts/config/agent_fallback_substitutions.yaml'
    - scripts/build/cf_preflight.py
    - scripts/lexical_sandbox.py
    - scripts/delegate.py
    - packaging/**
  ukrainian-content:
    - curriculum/**
    - data/lexicon/**
    - data/vocabulary/**
    - site/src/content/**
    - site/src/data/**
    - site/src/lib/lexicon/curated-heteronyms.ts
  low:
    - docs/**
    - data/**
    - tests/**
    - '**/tests/**'
    - README
    - README.md
    - README.rst
    - README.txt
    - '**/README'
    - '**/README.md'
    - '**/README.rst'
    - '**/README.txt'
    - CONTRIBUTING.md
    - CHANGELOG.md
    - LICENSE
    - LICENSE.md
    - LICENSE.txt
    - SECURITY.md
# Removed High/content paths keep their tier; all other removals are Low.
