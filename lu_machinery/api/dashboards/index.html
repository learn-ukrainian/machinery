<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machinery</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1f23; --muted: #6a6f78; --bg: #f7f7f8; --card: #fff; --line: #e3e4e8;
          --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6e7ea; --muted: #9aa0aa; --bg: #15171a; --card: #1d2024; --line: #30343a;
            --ok: #3fb950; --warn: #d29922; --bad: #f85149; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  header { display: flex; align-items: baseline; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  header .muted { font-size: 12px; }
  main { display: grid; gap: 16px; padding: 16px 20px; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  section.wide { grid-column: 1 / -1; }
  h2 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; }
  h2 .age { font-weight: normal; font-size: 12px; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); font-weight: 600; }
  .error { color: var(--bad); }
  .bar { display: inline-block; width: 70px; height: 8px; background: var(--line); border-radius: 4px; vertical-align: middle; margin-right: 6px; }
  .bar > span { display: block; height: 100%; border-radius: 4px; }
  a { color: inherit; }
  table.subs td { white-space: normal; min-width: 4.5em; }
  table.subs td.num { white-space: nowrap; }
  table.subs th[colspan] { padding-top: 8px; color: var(--fg); }
</style>
</head>
<body>
<header>
  <h1>Machinery</h1>
  <span class="muted" id="last-refresh">Loading…</span>
  <span class="muted">Refreshes every 30 s. Times are UTC.</span>
</header>
<main>
  <section class="wide"><h2>Live workers <span class="age" id="workers-age"></span></h2><div id="workers-content">Loading…</div></section>
  <section class="wide"><h2>Subscriptions: usage, pace and resets <span class="age" id="usage-age"></span></h2><div id="usage-content">Loading…</div></section>
  <section><h2>Sign-ins <span class="age" id="logins-age"></span></h2><div id="logins-content">Loading…</div></section>
  <section><h2>Fleet Comms <span class="age" id="comms-age"></span></h2><div id="comms-content">Loading…</div></section>
  <section class="wide"><h2>Recently finished <span class="age" id="recent-age"></span></h2><div id="recent-content">Loading…</div></section>
</main>
<script>
"use strict";
const API_TIMEOUT_MS = 8000;
const REFRESH_MS = 30000;
const ACTIVE = new Set(["spawning", "running", "settling", "needs_finalize"]);

function escapeHtml(value) {
  return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

async function fetchJson(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
  try {
    const response = await fetch(url, {signal: controller.signal, headers: {Accept: "application/json"}});
    if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
    let data;
    try { data = JSON.parse(await response.text()); } catch { throw new Error(`${url}: Invalid JSON`); }
    if (data === null || typeof data !== "object" || Array.isArray(data)) throw new Error(`${url}: Invalid JSON shape`);
    const rawAge = response.headers.get("X-Snapshot-Age-S");
    const age = rawAge === null ? null : Number(rawAge);
    return {data, age: age !== null && Number.isFinite(age) && age >= 0 ? age : null,
      snapshot: rawAge !== null};
  } finally {
    clearTimeout(timer);
  }
}

function toDate(value) {
  if (value === null || value === undefined || value === "") return null;
  const moment = typeof value === "number" ? new Date(value < 1e11 ? value * 1000 : value) : new Date(value);
  return Number.isNaN(moment.getTime()) ? null : moment;
}

function utc(value) {
  const moment = toDate(value);
  return moment ? moment.toISOString().slice(0, 16).replace("T", " ") + "Z" : "—";
}

function span(seconds) {
  if (seconds === null || seconds === undefined || !Number.isFinite(seconds)) return "—";
  const s = Math.abs(Math.round(seconds));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`;
}

function relative(value) {
  const moment = toDate(value);
  if (!moment) return "";
  const seconds = (moment.getTime() - Date.now()) / 1000;
  return seconds >= 0 ? `in ${span(seconds)}` : `${span(seconds)} ago`;
}

function validPct(value) {
  return typeof value === "number" && Number.isFinite(value) && value >= 0 && value <= 100;
}

function pct(value) {
  return validPct(value) ? `${Math.round(value)}%` : "—";
}

function bar(left) {
  if (!validPct(left)) return "";
  const width = left;
  const color = left < 15 ? "var(--bad)" : left < 35 ? "var(--warn)" : "var(--ok)";
  return `<span class="bar"><span style="width:${width}%;background:${color}"></span></span>`;
}

function paceClass(pace) {
  const text = String(pace || "");
  return /deficit|runs out/i.test(text) ? "warn" : /reserve|lasts/i.test(text) ? "ok" : "muted";
}

function table(headers, rows) {
  if (!rows.length) return '<p class="muted">None.</p>';
  return `<table><thead><tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>`
    + rows.map(cells => `<tr>${cells.join("")}</tr>`).join("") + "</tbody></table>";
}

const td = (html, cls = "") => `<td${cls ? ` class="${cls}"` : ""}>${html}</td>`;
const text = (value, cls = "") => td(value === null || value === undefined || value === "" ? "—" : escapeHtml(value), cls);

function prCell(task) {
  const pr = task.delivery_pr;
  if (!pr) return text(null);
  const match = /^([\w.-]+\/[\w.-]+)#(\d+)$/.exec(String(pr));
  if (!match) return text(pr);
  return td(`<a href="https://github.com/${escapeHtml(match[1])}/pull/${escapeHtml(match[2])}">${escapeHtml(pr)}</a>`);
}

function account(task) {
  return task.claude_account ? `claude ${task.claude_account}` : task.codex_account ? `codex ${task.codex_account}` : null;
}

function modelOf(task) {
  return task.observed_model || task.model || null;
}

function renderWorkers(active) {
  const tasks = Array.isArray(active.tasks) ? active.tasks : [];
  return table(["Task", "Agent / model", "Account", "Doing", "PR", "Runtime", "Record updated"], tasks.map(task => [
    text(task.task_id),
    text([task.agent, modelOf(task)].filter(Boolean).join(" / ")),
    text(account(task)),
    text([task.status, task.research_role, task.repository].filter(Boolean).join(" · ")),
    prCell(task),
    text(span(task.age_s), "num"),
    text(task.updated_at ? `${utc(task.updated_at)} (${relative(task.updated_at)})` : null),
  ]));
}

function renderRecent(list) {
  const tasks = (Array.isArray(list.tasks) ? list.tasks : []).filter(task => !ACTIVE.has(task.status));
  const attention = list.needs_attention || {};
  const pending = Array.isArray(attention.tasks) ? attention.tasks : [];
  const attentionHtml = attention.total ? `<p class="bad">${escapeHtml(attention.total)} unfinished task records need attention. Showing up to ${pending.length}.</p>`
    + table(["Task", "Agent / model", "State"], pending.map(task => [text(task.task_id),
      text([task.agent, modelOf(task)].filter(Boolean).join(" / ")), text(task.status, "bad")])) : "";
  return attentionHtml + table(["Task", "Agent / model", "Outcome", "Finished", "Duration", "PR"], tasks.map(task => [
    text(task.task_id),
    text([task.agent, modelOf(task)].filter(Boolean).join(" / ")),
    text(task.status, task.status === "done" ? "ok" : "bad"),
    text(task.finished_at ? `${utc(task.finished_at)} (${relative(task.finished_at)})` : null),
    text(span(task.duration_s), "num"),
    prCell(task),
  ]));
}

// A "fresh" flag is believed only with a numeric age inside the threshold;
// an older reading is stale whatever the flag says.
function readingState(freshness, ageS, thresholdS) {
  const aged = typeof ageS === "number" && Number.isFinite(ageS) && ageS >= 0;
  const limit = typeof thresholdS === "number" && thresholdS > 0 ? thresholdS : 900;
  if (freshness === "stale" || ((freshness === "fresh") && aged && ageS > limit)) return "stale";
  if (freshness === "fresh") return aged ? "fresh" : "unknown";
  return freshness ? String(freshness) : "missing";
}

function freshnessCell(state, ageS) {
  const age = typeof ageS === "number" && Number.isFinite(ageS) ? `${span(ageS)} old` : "age unknown";
  if (state === "fresh") return text(`fresh, ${age}`, "ok");
  if (state === "stale") return text(`STALE, ${age}`, "bad");
  if (state === "unknown") return text(`FRESHNESS UNKNOWN, ${age}`, "bad");
  return text(state === "missing" ? "NO READING" : state.toUpperCase(), "bad");
}

function pp(value) {
  return typeof value === "number" && Number.isFinite(value) ? `${Math.round(Math.abs(value))} pp` : null;
}

function windowLeft(window) {
  if (!window || window.status === "none") return text("none", "muted");
  if (window.status !== "ok" || !validPct(window.left_pct)) return text("unknown", "muted");
  return td(`${bar(window.left_pct)}${escapeHtml(pct(window.left_pct))}`, "num");
}

function resetText(window) {
  if (!window || window.status !== "ok") return null;
  if (!toDate(window.resets_at)) return "reset not reported";
  if (window.reset_passed) return `${utc(window.resets_at)} (passed; awaiting a new reading)`;
  return `${utc(window.resets_at)} (${relative(window.resets_at)})`;
}

function weeklyResetCell(window) {
  if (!window || window.status !== "ok") return text("unknown", "muted");
  if (!toDate(window.resets_at)) return text("not reported", "muted");
  if (window.reset_passed) return text(`passed; awaiting a new reading (${utc(window.resets_at)})`, "warn");
  return td(`<strong>${escapeHtml(relative(window.resets_at))}</strong><br><span class="muted">${escapeHtml(utc(window.resets_at))}</span>`);
}

function paceCell(pace) {
  if (!pace || pace.status !== "ok") return text("unknown", "muted");
  const head = pace.state === "on_pace" ? "on pace"
    : pace.state === "reserve" ? `${pp(pace.headroom_pct)} headroom` : `${pp(pace.headroom_pct)} deficit`;
  const tail = pace.lasts_to_reset === true ? "lasts to reset"
    : pace.lasts_to_reset === false ? (!toDate(pace.runs_out_at) ? "runs out before reset"
      : toDate(pace.runs_out_at).getTime() <= Date.now() ? `ran out ${utc(pace.runs_out_at)} (${relative(pace.runs_out_at)})`
      : `runs out ${utc(pace.runs_out_at)} (${relative(pace.runs_out_at)})`)
    : "last-to-reset unknown";
  return text(`${head} · ${tail}`, pace.state === "deficit" ? (pace.lasts_to_reset === false ? "bad" : "warn") : "ok");
}

function sessionCell(window) {
  if (!window || window.status === "none") return text("none", "muted");
  if (window.status !== "ok" && window.reason === "not_reported") return text("not reported", "muted");
  if (window.status !== "ok" || !validPct(window.left_pct)) return text("unknown", "muted");
  return text(`${pct(window.left_pct)} left · ${resetText(window)}`);
}

function extraCell(row) {
  if (!row.reading?.read_at) return text("unknown", "muted");
  const windows = (Array.isArray(row.extra_windows) ? row.extra_windows : []).map(window =>
    `${window.label || "window"} ${window.status === "ok" && validPct(window.left_pct) ? `${pct(window.left_pct)} left` : "unknown"}`);
  const breakdown = (Array.isArray(row.breakdown) ? row.breakdown : []).map(item => `${item.label} ${item.value}`);
  return text([...windows, ...breakdown].join("; ") || "none", windows.length || breakdown.length ? "" : "muted");
}

function creditsCell(credits) {
  if (credits?.status === "ok" && typeof credits.balance === "number") {
    const balance = credits.balance.toLocaleString("en-US", {maximumFractionDigits: 1});
    return text(credits.renews_on ? `${balance} (renew ${credits.renews_on} with the plan)` : balance);
  }
  return credits?.status === "none" ? text("none", "muted") : text("unknown", "muted");
}

function planCell(plan) {
  const name = plan?.name || "plan unknown";
  if (!plan || plan.status !== "ok") return text(`${name} · renewal unknown`, "muted");
  if (plan.cancelled) {
    return text(`${name} · ${plan.ends_on ? `${plan.ended ? "ENDED" : "cancelled, ends"} ${plan.ends_on} (${plan.days_to_end} d)`
      : "cancelled, end date not configured"}`, "warn");
  }
  if (!plan.next_renewal_on) return text(`${name} · renewal not configured`, "muted");
  return text(`${name} · renews ${plan.next_renewal_on} (in ${plan.days_to_renewal} d)`, plan.days_to_renewal <= 3 ? "warn" : "muted");
}

function bankedCell(banked) {
  if (!banked || banked.status !== "ok" || typeof banked.count !== "number") return text("unknown", "muted");
  const items = (Array.isArray(banked.items) ? banked.items : []).filter(item => !item.expired)
    .map(item => `${item.count}× ${item.kind || "reset"}${item.expires_on ? `, expires ${String(item.expires_on).slice(0, 10)}` : ""}`);
  return text(`${banked.count}${items.length ? ` (${items.join("; ")})` : ""}`, banked.count ? "ok" : "");
}

function readingCell(reading, staleAfter) {
  const state = readingState(reading?.status, reading?.age_s, staleAfter);
  if (state === "missing" || state === "unknown" && !reading?.read_at) {
    return text(`NO READING${reading?.reason ? ` (${String(reading.reason).replaceAll("_", " ")})` : ""}`, "bad");
  }
  return freshnessCell(state, reading?.age_s);
}

const SUBSCRIPTION_HEADERS = ["Account", "Weekly resets", "Weekly left", "Pace", "5-hour", "Other windows",
  "Credits", "Banked resets", "Plan · renews or ends", "Reading"];

function subscriptionRows(subs) {
  const staleAfter = subs.stale_after_s;
  const hidden = [];
  const groups = (Array.isArray(subs.providers) ? subs.providers : []).map(provider => {
    const accounts = (Array.isArray(provider.accounts) ? provider.accounts : []).filter(row => {
      if (row.plan?.ended) { hidden.push(`${row.account} (ended ${row.plan.ends_on})`); return false; }
      return true;
    });
    if (!accounts.length) return "";
    return `<tr><th colspan="${SUBSCRIPTION_HEADERS.length}">${escapeHtml(provider.label || provider.provider)}</th></tr>`
      + accounts.map(row => {
        const weekly = row.weekly || {};
        return `<tr>${[
          text(row.account),
          weeklyResetCell(weekly),
          windowLeft(weekly),
          paceCell(row.pace),
          sessionCell(row.session),
          extraCell(row),
          creditsCell(row.credits),
          bankedCell(row.banked_resets),
          planCell(row.plan),
          readingCell(row.reading, staleAfter),
        ].join("")}</tr>`;
      }).join("");
  }).join("");
  return {groups, hidden};
}

function apiRows(budget) {
  const accounts = budget.api_accounts || {};
  return Object.entries(accounts).map(([name, row]) => {
    const balance = typeof row.total_balance === "number" ? `${row.total_balance.toFixed(2)} ${row.currency || ""} balance`
      : typeof row.limit_remaining_usd === "number" ? `$${row.limit_remaining_usd.toFixed(2)} left`
      : row.balance_probe_state ? `balance ${row.balance_probe_state}` : null;
    const spent = typeof row.usage_weekly_usd === "number" ? `$${row.usage_weekly_usd.toFixed(2)} this week` : null;
    return [text(name), text([balance, spent].filter(Boolean).join("; ") || null),
            freshnessCell(readingState(row.freshness, row.age_s, budget.diagnostics?.stale_threshold_s), row.age_s),
            text(row.health?.healthy === false ? "unhealthy" : null, "bad")];
  });
}

function renderUsage(subs, budget) {
  const {groups, hidden} = subscriptionRows(subs);
  const facts = subs.sources?.plan_facts;
  const notes = [];
  if (facts?.reason) {
    notes.push(`Plan facts: ${facts.reason === "not_configured" ? "not configured" : facts.reason}; renewal, plan and banked resets show unknown.`);
  }
  const cache = subs.sources?.usage_cache;
  if (cache && cache.status !== "ok") notes.push(`Usage cache: ${cache.status}.`);
  if (hidden.length) notes.push(`Hidden, subscription ended: ${hidden.join(", ")}.`);
  notes.push("Headroom and deficit are percentage points against an even pace to the weekly reset. Carbon draws on the AGY pools. "
    + "The Codex API credits belong to Codex a and renew with its monthly turnover.");
  const head = `<thead><tr>${SUBSCRIPTION_HEADERS.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr></thead>`;
  return (groups ? `<table class="subs">${head}<tbody>${groups}</tbody></table>` : '<p class="muted">None.</p>')
    + notes.map(note => `<p class="muted">${escapeHtml(note)}</p>`).join("")
    + table(["API account", "Balance / spend", "Reading", ""], apiRows(budget || {}));
}

function renderLogins(logins) {
  if (logins.state === "pending") return '<p class="muted">Checking sign-ins…</p>';
  const rows = (logins.accounts || []).map(row => {
    const signed = row.logged_in === true ? text("signed in", "ok") : row.logged_in === false ? text("SIGNED OUT", "bad")
      : text(`UNKNOWN${row.error ? ` (${row.error.replaceAll("_", " ")})` : ""}`, "bad");
    const expires = toDate(row.expires_at);
    const daysLeft = expires ? (expires.getTime() - Date.now()) / 86400000 : null;
    const expiry = row.expires_at ? text(`${utc(row.expires_at)} (${relative(row.expires_at)})`, daysLeft < 3 ? "bad" : daysLeft < 7 ? "warn" : "")
      : text(row.expiry_reported === false ? "not reported by the CLI" : null, "muted");
    return [text(row.account), signed, text([row.authMethod, row.subscriptionType].filter(Boolean).join(" · ") || null), expiry];
  });
  return table(["Account", "Status", "Login", "Sign-in ends"], rows)
    + `<p class="muted">Checked ${escapeHtml(utc(logins.read_at))}. AGY has no side-effect-free sign-in reader.</p>`;
}

function renderComms(metrics) {
  const deliveries = metrics.deliveries || {}, jobs = metrics.jobs || {};
  const reachable = metrics.store?.reachable;
  return table(["Measure", "Count"], [
    [text("Store"), text(reachable ? `${metrics.source || "plane"} reachable` : "UNREACHABLE", reachable ? "ok" : "bad")],
    [text("Deliveries queued"), text(deliveries.queued, "num")],
    [text("Dead letters"), text(metrics.dead_letters, metrics.dead_letters ? "num warn" : "num")],
    [text("Deliveries failed"), text(deliveries.failed, deliveries.failed ? "num warn" : "num")],
    [text("Jobs queued"), text(jobs.queued, "num")],
    [text("Jobs failed"), text(jobs.failed, jobs.failed ? "num warn" : "num")],
  ]);
}

let logins = null;
const PANELS = [
  {id: "workers", urls: ["/api/delegate/active"], render: renderWorkers},
  {id: "recent", urls: ["/api/delegate/recent"], render: renderRecent},
  {id: "usage", urls: ["/api/runtime/subscriptions", "/api/state/routing-budget"], render: renderUsage},
  {id: "logins", urls: ["/api/runtime/logins"], render: renderLogins},
  {id: "comms", urls: ["/api/comms/v1/metrics"], render: renderComms},
];
const inFlight = new Set();

async function loadPanel(panel) {
  if (inFlight.has(panel.id)) return;
  inFlight.add(panel.id);
  const content = document.getElementById(`${panel.id}-content`);
  const age = document.getElementById(`${panel.id}-age`);
  try {
    const readings = await Promise.all(panel.urls.map(fetchJson));
    content.innerHTML = panel.render(...readings.map(reading => reading.data));
    const snapshots = readings.filter(reading => reading.snapshot);
    age.textContent = snapshots.some(reading => reading.age === null) ? "Source age unknown"
      : snapshots.length ? `Source age ${Math.ceil(Math.max(...snapshots.map(reading => reading.age)))}s`
      : `read ${new Date().toISOString().slice(11, 19)}Z`;
    age.className = snapshots.some(reading => reading.age === null || reading.age > REFRESH_MS / 1000)
      ? "bad" : "";
    if (panel.id === "logins") {
      logins = readings[0].data;
      if (logins.state === "pending") setTimeout(() => loadPanel(panel), 3000);
    }
  } catch (error) {
    content.innerHTML = `<p class="error">Unavailable: ${escapeHtml(error.message || error)}</p>`;
    age.textContent = "";
  } finally {
    inFlight.delete(panel.id);
  }
}

async function refreshAll() {
  await Promise.all(PANELS.map(loadPanel));
  document.getElementById("last-refresh").textContent = `Refreshed ${new Date().toISOString().slice(11, 19)}Z`;
}

refreshAll();
setInterval(refreshAll, REFRESH_MS);
</script>
</body>
</html>
